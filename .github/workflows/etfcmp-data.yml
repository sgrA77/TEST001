name: ETF Compare Data (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch
        run: python ETFCMP_FETCH.py
      - name: Publish to etfcmp-data branch
        run: |
          cp etfcmp.json "$RUNNER_TEMP/ec.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan etfcmp-data
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP/ec.json" etfcmp.json
          git add etfcmp.json
          git commit -qm "etfcmp $(date -u +%FT%TZ)"
          git push -f origin etfcmp-data
