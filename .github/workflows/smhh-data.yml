name: SMH holdings (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python SMHH_FETCH.py
      - name: Publish
        run: |
          cp smhh.json "$RUNNER_TEMP/s.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan smhh-data
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP/s.json" smhh.json
          git add smhh.json
          git commit -qm "smhh"
          git push -f origin smhh-data
