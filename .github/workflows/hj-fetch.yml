name: HJ prices (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python HJ_FETCH.py
      - name: Publish to hj-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(for f in hj_prices.json hj_targets.json; do printf '100644 blob %s\t%s\n' "$(git hash-object -w $f)" "$f"; done | git mktree)
          commit=$(git commit-tree "$tree" -m "hj prices $(date -u +%FT%TZ)")
          git push -f origin "$commit:refs/heads/hj-prices"
