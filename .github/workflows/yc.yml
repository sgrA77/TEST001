name: Year candle (daily)

# 연봉(올해 시가 대비) 양/음봉 정보. 하루 2회, 'yc-data' 브랜치에 게시(main 커밋 없음).
on:
  schedule:
    - cron: "20 22 * * *"
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yc
  cancel-in-progress: false

jobs:
  yc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python YC.py
      - name: Publish to yc-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(printf '100644 blob %s\tyc.json\n' "$(git hash-object -w yc.json)" | git mktree)
          commit=$(git commit-tree "$tree" -m "yc $(date -u +%FT%TZ)")
          git push -f origin "$commit:refs/heads/yc-data"
