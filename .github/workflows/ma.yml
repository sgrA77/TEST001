name: MA Tracker

# 주봉 MA60/120 은 하루 몇 번만 바뀌어도 충분해서 1회성 실행(하루 4회, 장 마감 후 위주).
# 장중 현재가는 prices.yml 이 따로 10분마다 갱신하고, 화면에서 MA 를 현재가 변화분만큼 보정합니다.
on:
  schedule:
    - cron: "25 1,7,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ma-tracker
  cancel-in-progress: false

# 결과(ma.json)는 main 이 아니라 'ma-data' 브랜치(커밋 1개, 매번 덮어씀)에 저장합니다.
# main 에 자주 커밋하면 test.yml(git push 재시도 없음)의 푸시가 충돌해 실패하기 때문입니다.
jobs:
  ma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 이전 결과 불러오기 (수집 실패 시 값 유지용)
        run: |
          git fetch origin ma-data 2>/dev/null && git show FETCH_HEAD:ma.json > ma.json || echo "no previous ma.json"
      - name: Run MA.py
        run: python MA.py
      - name: Publish to ma-data branch
        run: |
          blob=$(git hash-object -w ma.json)
          tree=$(printf '100644 blob %s\tma.json\n' "$blob" | git mktree)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(git commit-tree "$tree" -m "ma.json $(date -u +%FT%TZ)")
          git push -f origin "$commit:refs/heads/ma-data"
