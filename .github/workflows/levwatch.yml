name: Leverage watch (daily)

# 매일 미국 장 마감 후(KST 오전 7시경) 1회. 결과는 main 이 아니라 'levw-data' 브랜치에 게시합니다
# (main 에 자주 커밋하면 test.yml 의 푸시가 충돌할 수 있어서 ma.yml 과 같은 방식).
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: levwatch
  cancel-in-progress: false

jobs:
  levw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 이전 상태 불러오기 (신규/이탈 비교용)
        run: |
          git fetch origin levw-data 2>/dev/null && git show FETCH_HEAD:state.json > prev_state.json || echo "no previous state"
      - run: python LEVW_UPDATE.py
      - name: Publish to levw-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(for f in index.json levwatch-candidates.json state.json; do printf '100644 blob %s\t%s\n' "$(git hash-object -w out/$f)" "$f"; done | git mktree)
          commit=$(git commit-tree "$tree" -m "levwatch $(date -u +%FT%TZ)")
          git push -f origin "$commit:refs/heads/levw-data"
