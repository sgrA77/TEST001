name: US History Data (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch
        run: python USHIST_FETCH.py
      - name: Publish to ushist-data branch
        run: |
          cp ushist.json "$RUNNER_TEMP/uh.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ushist-data
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP/uh.json" ushist.json
          git add ushist.json
          git commit -qm "ushist $(date -u +%FT%TZ)"
          git push -f origin ushist-data
