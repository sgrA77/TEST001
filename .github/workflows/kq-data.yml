name: KOSDAQ data (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch
        run: python KQ_FETCH.py
      - name: Publish to kq-data branch
        run: |
          cp kq.json "$RUNNER_TEMP/kqd.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan kq-data
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP/kqd.json" kq.json
          git add kq.json
          git commit -qm "kq probe $(date -u +%FT%TZ)"
          git push -f origin kq-data
