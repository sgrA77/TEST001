name: Probe FRED
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install requests -q
          python - <<'PY'
          import requests,time
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"text/csv,text/plain,*/*"}
          urls=["https://r.jina.ai/https://fred.stlouisfed.org/data/BAMLH0A0HYM2.txt","https://r.jina.ai/https://fred.stlouisfed.org/data/BAMLC0A4CBBB.txt"]
          import re
          for u in urls:
              t=time.time()
              try:
                  r=requests.get(u,headers=UA,timeout=(8,15))
                  m=re.findall(r"(\d{4}-\d{2}-\d{2})\D{0,6}(-?\d+\.\d+)",r.text)
                  print(f"::notice title=probe::{r.status_code} n={len(m)} last={m[-3:]} tail={r.text[-300:]!r}")
              except Exception as e:
                  print(f"::warning title=probe::FAIL {type(e).__name__} {round(time.time()-t,1)}s {u[:70]}")
          PY
