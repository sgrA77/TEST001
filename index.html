<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color: #1a1a1a;
    background: #f4f5f7;
    margin: 0;
}

/* =========================================
   상단 헤더바
   ========================================= */

.topbar {
    background: #fff;
    border-bottom: 1px solid #e2e2e2;
    padding: 14px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topbar-title {
    font-size: 16px;
    font-weight: 700;
}

.updated-at {
    font-size: 12px;
    color: #999;
}

/* =========================================
   전체 레이아웃: 좌측 요약 사이드바 + 우측 종목 목록
   ========================================= */

.layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    padding: 20px 32px;
    align-items: start;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 20px;
}

.panel {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 14px 16px;
}

.panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 10px;
}

/* =========================================
   메인 영역 섹션 타이틀
   ========================================= */

h2.section-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #555;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #222;
}

.theme-label {
    font-size: 12px;
    color: #888;
    margin: 14px 0 6px;
    font-weight: 600;
}

.theme-label.category {
    font-size: 13px;
    color: #333;
    margin-top: 22px;
}

.theme-label.category:first-child {
    margin-top: 0;
}

/* =========================================
   카드 (지표/종목 공용)
   ========================================= */

.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.card {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 120px;
}

.card.leveraged {
    border-left: 3px solid #e08a2c;
}

.lev-tag {
    font-size: 10px;
    color: #e08a2c;
    font-weight: 600;
    margin-top: 2px;
}

.indicator-name {
    font-size: 11px;
    color: #666;
}

.indicator-value {
    font-size: 16px;
    font-weight: 700;
    margin-top: 2px;
}

.ticker {
    font-size: 13px;
    font-weight: 700;
}

.price {
    font-size: 17px;
    font-weight: 700;
    margin: 3px 0;
}

.change {
    font-size: 11px;
    color: #666;
}

/* =========================================
   사이드바 - 이벤트 리스트 (컴팩트)
   ========================================= */

.event-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
}

.event-row:last-child {
    border-bottom: none;
}

.event-row .event-name {
    font-weight: 600;
    color: #333;
}

.event-row .event-date {
    color: #888;
}

.event-row .event-hours {
    color: #e08a2c;
    font-weight: 600;
    margin-left: 8px;
}

/* =========================================
   사이드바 - 트렌딩 랭킹 리스트
   ========================================= */

.trend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
}

.trend-row:last-child {
    border-bottom: none;
}

.trend-rank {
    width: 18px;
    font-weight: 700;
    color: #aaa;
    font-size: 11px;
}

.trend-symbol {
    font-weight: 700;
    width: 56px;
}

.trend-price {
    width: 64px;
    text-align: right;
}

.trend-change {
    text-align: right;
    flex: 1;
}

/* =========================================
   메인 영역 - 섹션 헤더 + 기간 토글
   ========================================= */

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #222;
    margin-bottom: 12px;
    padding-bottom: 6px;
}

.section-header h2.section-title {
    border-bottom: none;
    margin: 0;
    padding: 0;
}

.range-toggle {
    display: flex;
    gap: 4px;
}

.range-toggle button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
    color: #666;
    cursor: pointer;
}

.range-toggle button.active {
    background: #222;
    color: #fff;
    border-color: #222;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="topbar-title">Market Dashboard</div>
    <div class="updated-at" id="updated-at"></div>
</div>

<div class="layout">

    <!-- 좌측: 한눈에 보는 요약 정보 -->
    <div class="sidebar">

        <div class="panel">
            <div class="panel-title">Indicators</div>
            <div id="indicators"></div>
        </div>

        <div class="panel">
            <div class="panel-title">🔥 Trending Now</div>
            <div id="trending"></div>
        </div>

        <div class="panel">
            <div class="panel-title">Market Events</div>
            <div id="events"></div>
        </div>

    </div>

    <!-- 우측: 종목 목록 -->
    <div class="main">
        <div class="section-header">
            <h2 class="section-title">Stocks</h2>
            <div class="range-toggle" id="range-toggle">
                <button data-range="day" class="active">1일</button>
                <button data-range="week">1주</button>
            </div>
        </div>
        <div id="stocks"></div>
    </div>

</div>

<script>

let currentRange = "day";   // "day" | "week" - Stocks 카드의 등락 기준
let latestStocks = null;

fetch("data.json?t=" + Date.now())
.then(r => r.json())
.then(data => {

    document.getElementById("updated-at").textContent =
        "Last updated: " + new Date().toLocaleString();

    latestStocks = data.stocks;

    renderIndicators(data.indicators);
    renderTrending(data.trending);
    renderEvents(data.events);
    renderStocks(latestStocks, currentRange);
});


document.getElementById("range-toggle").addEventListener("click", (e) => {

    const btn = e.target.closest("button[data-range]");
    if (!btn) return;

    currentRange = btn.dataset.range;

    document
        .querySelectorAll("#range-toggle button")
        .forEach(b => b.classList.toggle("active", b === btn));

    if (latestStocks) {
        renderStocks(latestStocks, currentRange);
    }
});


/* =========================================
   지표: 카테고리별 섹션 (사이드바, 컴팩트)
   ========================================= */

function renderIndicators(indicatorsByCategory) {

    const root = document.getElementById("indicators");

    for (const [category, items] of Object.entries(indicatorsByCategory)) {

        appendThemeLabel(root, category);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const [name, s] of Object.entries(items)) {

            if (s.value == null) continue;

            grid.innerHTML += `
            <div class="card">
                <div class="indicator-name">${name}</div>
                <div class="indicator-value">
                    ${Number(s.value).toFixed(2)}
                </div>
            </div>`;
        }

        root.appendChild(grid);
    }
}


/* =========================================
   트렌딩: 랭킹 리스트 (사이드바, Top N)
   ========================================= */

function renderTrending(trending) {

    const root = document.getElementById("trending");

    if (!trending || trending.length === 0) {
        root.innerHTML = `<div style="font-size:12px;color:#999;">데이터 없음</div>`;
        return;
    }

    for (const s of trending) {

        const p = Number(s.price);

        root.innerHTML += `
        <div class="trend-row">
            <div class="trend-rank">${s.rank}</div>
            <div class="trend-symbol">${s.symbol}</div>
            <div class="trend-price">${p.toFixed(2)}</div>
            <div class="trend-change">${change(p, s.previous_day)}</div>
        </div>`;
    }
}


/* =========================================
   주요 일정 (사이드바, 컴팩트 리스트)
   ========================================= */

function renderEvents(events) {

    const root = document.getElementById("events");

    for (const e of events) {

        const [md, time] = e.date.split(" ");
        const [month, day] = md.split("/");
        const [hour, minute] = time.split(":");

        const year = new Date().getFullYear();

        const eventDate = new Date(
            `${year}-${month}-${day}T${hour}:${minute}:00+09:00`
        );

        const now = new Date();

        const hours = Math.ceil(
            (eventDate - now) / (1000 * 60 * 60)
        );

        if (!Number.isFinite(hours) || hours <= 0) continue;

        root.innerHTML += `
        <div class="event-row">
            <div>
                <span class="event-name">${e.name}</span>
                <span class="event-date">${e.date}</span>
            </div>
            <span class="event-hours">${hours}h</span>
        </div>`;
    }
}


/* =========================================
   종목: 대분류(category) -> 테마(theme) -> 카드 (메인 영역)
   ========================================= */

function renderStocks(stocksByCategory, range) {

    const root = document.getElementById("stocks");
    root.innerHTML = "";   // 토글 전환 시 기존 내용 초기화 후 다시 그림

    const refKey   = range === "week" ? "previous_week" : "previous_day";
    const refLabel = range === "week" ? "1주" : "1일";

    for (const [category, themes] of Object.entries(stocksByCategory)) {

        appendThemeLabel(root, category, "category");

        for (const [theme, items] of Object.entries(themes)) {

            if (theme !== category) {
                appendThemeLabel(root, theme);
            }

            const grid = document.createElement("div");
            grid.className = "grid";

            for (const [name, s] of Object.entries(items)) {

                const p = Number(s.price);
                const isLev = !!s.leverage_of;

                grid.innerHTML += `
                <div class="card ${isLev ? "leveraged" : ""}">
                    <div class="ticker">${name}</div>
                    <div class="price">${p.toFixed(2)}</div>
                    <div class="change">
                        ${refLabel} ${change(p, s[refKey])}
                    </div>
                    ${isLev ? `<div class="lev-tag">Lv. of ${s.leverage_of}</div>` : ""}
                </div>`;
            }

            root.appendChild(grid);
        }
    }
}


function appendThemeLabel(root, text, extraClass) {
    const label = document.createElement("div");
    label.className = "theme-label" + (extraClass ? " " + extraClass : "");
    label.textContent = text;
    root.appendChild(label);
}


function change(p, r) {

    if (r == null) return "-";

    const v = (p - Number(r)) / Number(r) * 100;

    const color =
        v > 0 ? "#c0392b" :
        v < 0 ? "#2455a4" :
        "#333";

    const sign = v > 0 ? "+" : "";

    return `<span style="color:${color}">
                ${sign}${v.toFixed(2)}%
            </span>`;
}

</script>

</body>
</html>
