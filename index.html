<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Dashboard</title>

<style>
body {
    font-family: Inter, Arial, sans-serif;
}

#indicators {
    display: flex;
    gap: 25px;
    border: 1px solid #ccc;
    padding: 12px 15px;
    margin-bottom: 30px;
    width: fit-content;
}

.indicator {
    width: 130px;
    text-align: center;
}

.indicator-name {
    height: 32px;
    font-size: 13px;
    line-height: 16px;
}

.indicator-value {
    font-size: 18px;
    font-weight: bold;
}

#stocks {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
}

.stock {
    min-width: 150px;
}

.ticker {
    font-size: 15px;
    font-weight: bold;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 3px 0;
}

.change {
    font-size: 13px;
}
</style>
</head>

<body>

<h3>US market</h3>

<div id="indicators"></div>

<div id="stocks"></div>

<script>

fetch("data.json?t=" + Date.now())
.then(r => r.json())
.then(data => {

    /* 지표 */
    for (const [name, s] of Object.entries(data.indicators)) {

        document.getElementById("indicators").innerHTML += `
        <div class="indicator">
            <div class="indicator-name">${name}</div>
            <div class="indicator-value">${Number(s.value).toFixed(2)}</div>
        </div>`;
    }

    /* 주식 */
    for (const [name, s] of Object.entries(data.stocks)) {

        let p = Number(s.price);

        document.getElementById("stocks").innerHTML += `
        <div class="stock">

            <div class="ticker">${name}</div>

            <div class="price">
                ${p.toFixed(2)}
            </div>

            <div class="change">
                1M ${change(p, s.previous_month)}
                |
                1Y ${change(p, s.previous_year)}
            </div>

        </div>`;
    }
});

function change(p, r) {

    if (r == null) return "-";

    let v = (p - Number(r)) / Number(r) * 100;

    let color =
        v > 0 ? "red" :
        v < 0 ? "blue" :
        "black";

    let sign = v > 0 ? "+" : "";

    return `<span style="color:${color}">
                ${sign}${v.toFixed(2)}%
            </span>`;
}

</script>

</body>
</html>
