<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Dashboard</title>
<style>
/* =========================================================
   색 · 크기 설정 (여기 숫자만 바꾸면 전체에 반영)
   상승 = 빨강 / 하락 = 파랑, 변동폭이 클수록 진하게
   ========================================================= */
:root {
    --bg: #f3f5f8;          /* 페이지 바탕 */
    --surface: #ffffff;     /* 영역(섹션) 바탕 */
    --card: #fafbfc;        /* 카드 바탕 */
    --line: #e3e7ed;
    --text: #151a23;
    --sub: #5f6b7a;
    --dim: #9aa3b0;
    --accent: #f0b90b;      /* 포인트 (섹터 점, 제목 막대) */
    --accent-t: #946200;    /* 흰 바탕 위 강조 글자 */
    --up: 220, 38, 38;      /* 상승 빨강 (rgb) */
    --down: 29, 95, 214;    /* 하락 파랑 (rgb) */
    --up-t: #d02828;
    --down-t: #1b57c4;
    --earn: #7c3aed;        /* EVENTS: 실적 */
    --ipo: #0e8f8a;         /* EVENTS: IPO */
    --cw: 226px;            /* PC 카드 폭 */
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.35; font-variant-numeric: tabular-nums;
}
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
.up { color: var(--up-t); }
.down { color: var(--down-t); }
.empty { color: var(--sub); font-size: 13px; padding: 4px 0; }

/* ---------- 상단 바 (스크롤해도 고정) ---------- */
.top {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 18px; background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
.top-vals { display: flex; flex-wrap: wrap; gap: 2px 18px; }
.tv { white-space: nowrap; }
.tv b { font-size: 11px; font-weight: 700; color: var(--sub); margin-right: 5px; }
.tv span { font-size: 16px; font-weight: 800; }
.upd { font-size: 10px; color: var(--dim); white-space: nowrap; }
.upd.late { color: var(--up-t); font-weight: 700; }

/* ---------- 영역 ---------- */
.wrap { max-width: 1800px; margin: 0 auto; padding: 12px 18px 40px; }
.sec {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px 14px; margin-bottom: 12px;
}
.sec-title {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
    font-size: 13px; font-weight: 800; letter-spacing: .08em;
}
.sec-title::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }
.fold-hint { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--dim); }
.fold-hint::after { content: "펼치기 ▸"; }
details[open] > summary .fold-hint::after { content: "접기 ▾"; }
details.sec:not([open]) > summary .sec-title { margin-bottom: 0; }

/* ---------- EVENTS ---------- */
.sec.events-sec { padding: 8px 12px 10px; }
.sec.events-sec .sec-title { margin-bottom: 6px; }
.events { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 5px; }
.ev {
    min-width: 0; padding: 4px 8px 5px; border-radius: 6px;
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--dim);
}
.ev.soon { background: #fff7de; border-left-color: var(--accent); }
.ev.k-earn { border-left-color: var(--earn); }
.ev.k-ipo { border-left-color: var(--ipo); }
.ev-r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.ev-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev-tag { font-size: 9.5px; font-weight: 800; margin-right: 3px; }
.k-earn .ev-tag { color: var(--earn); }
.k-ipo .ev-tag { color: var(--ipo); }
.ev-dd { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
.ev.soon .ev-dd { color: var(--accent-t); }
.ev-r2 { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-r2 .short { display: none; }

/* ---------- 섹터 / 카드 (MARKET · MACRO 공통) ---------- */
.sectors { display: flex; flex-wrap: wrap; gap: 16px 24px; }
.sector { min-width: 0; }
.s-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.s-name { display: inline-flex; align-items: center; font-size: 14.5px; font-weight: 800; }
.s-name::before {
    content: ""; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px rgba(240, 185, 11, .2);
}
details.sector:not([open]) > summary { margin-bottom: 0; }

.cards { display: grid; gap: 7px; grid-template-columns: repeat(var(--n, 1), var(--cw)); }

.card {
    display: flex; flex-direction: column; gap: 5px; min-width: 0;
    padding: 8px 9px; background: var(--card); border: 1px solid var(--line); border-radius: 9px;
}
.c-r1, .c-r2 { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; min-width: 0; }
.c-name { font-size: 14px; font-weight: 800; white-space: nowrap; }
.c-price { margin-left: auto; font-size: 14px; font-weight: 700; white-space: nowrap; }
.c-sub { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
.c-day { margin-left: auto; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.stale { font-size: 9.5px; font-weight: 700; color: #5c4400; background: #ffe48a; border-radius: 3px; padding: 0 3px; margin-left: 4px; }

/* 1M · 1Y · 2Y 박스: 라벨은 박스 안 좌측 상단 */
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.chip {
    position: relative; border-radius: 4px; text-align: center; white-space: nowrap;
    padding: 10px 1px 2px; font-size: 12px; font-weight: 700; letter-spacing: -.02em;
}
.chip i { position: absolute; top: 1px; left: 4px; font-style: normal; font-size: 8.5px; font-weight: 700; opacity: .75; letter-spacing: 0; }

/* 아이콘 (로고 → 실패 시 글자) */
.ico {
    position: relative; flex: none; overflow: hidden; width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 800; box-shadow: 0 0 0 1px var(--line);
}
.ico img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 2px; opacity: 0; }
.ico img.ok { opacity: 1; }

/* ---------- EARNINGS ---------- */
.earns { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 8px; }
.ecard { padding: 8px 10px 9px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
.ecard.soon { background: #fffaea; border-color: #f3dc8f; }
.e-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 5px; }
.e-sym { font-size: 14.5px; font-weight: 800; }
.e-co { font-size: 11px; color: var(--sub); }
.e-when { margin-left: auto; font-size: 11px; color: var(--sub); white-space: nowrap; }
.e-dd { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
.ecard.soon .e-dd { color: var(--accent-t); }
.etbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.etbl th { font-size: 10px; font-weight: 700; color: var(--sub); padding: 0 2px 2px; text-align: center; }
.etbl th.rowh { width: 34px; text-align: left; }
.etbl td { padding: 3px 2px; text-align: center; border-top: 1px solid var(--line); vertical-align: top; }
.etbl td.next { background: #f1f3f7; }
.q-v { font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.q-c { display: inline-block; margin-top: 1px; padding: 0 4px; border-radius: 3px; font-size: 10px; font-weight: 700; }
.q-s { font-size: 9.5px; font-weight: 700; white-space: nowrap; }

/* ---------- 경고 ---------- */
.warns { color: var(--sub); font-size: 11.5px; padding: 0 4px; }
.warns ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }

/* ---------- 화면 폭별 ---------- */
@media (max-width: 1150px) { .cards.n4 { --n: 3; } }
@media (max-width: 900px)  { .cards.n3, .cards.n4 { --n: 2; } }

@media (max-width: 760px) {
    .top { padding: 6px 12px; }
    .top-vals { gap: 0 12px; }
    .tv span { font-size: 15px; }
    .wrap { padding: 8px 8px 30px; }
    .sec { padding: 10px 9px 11px; border-radius: 10px; margin-bottom: 9px; }

    /* EVENTS: 한 줄 3칸, 날짜/남은시간은 짧게 */
    .sec.events-sec { padding: 6px 7px 7px; }
    .events { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
    .ev { padding: 2px 5px 3px; border-left-width: 2px; }
    .ev-name { font-size: 11.5px; }
    .ev-tag { font-size: 8.5px; margin-right: 2px; }
    .ev-dd { font-size: 11.5px; }
    .ev-r2 { font-size: 9px; }
    .ev-r2 .full { display: none; }
    .ev-r2 .short { display: inline; }

    /* MARKET · MACRO: 섹터는 전체 폭, 카드는 한 줄 2개 */
    .sectors { gap: 12px; }
    .sector { flex: 1 1 100%; }
    .cards, .cards.n3, .cards.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
    .card { padding: 6px 6px 6px; gap: 4px; }
    .ico { width: 19px; height: 19px; font-size: 7.5px; }
    .c-name, .c-price { font-size: 13px; }
    .c-sub { font-size: 10px; }
    .c-day { font-size: 11px; }
    .chip { font-size: 10.5px; padding: 9px 0 2px; letter-spacing: -.04em; }
    .chip i { font-size: 7.5px; left: 2px; }

    .earns { grid-template-columns: minmax(0, 1fr); }
    .etbl th.rowh { width: 28px; }
    .q-v { font-size: 11.5px; }
}
</style>
</head>

<body>

<header class="top">
    <div class="top-vals" id="top"></div>
    <div class="upd" id="upd"></div>
</header>

<main class="wrap">

    <section class="sec events-sec">
        <h2 class="sec-title">EVENTS</h2>
        <div class="events" id="events"></div>
    </section>

    <section class="sec">
        <h2 class="sec-title">MARKET</h2>
        <div class="sectors" id="market"></div>
    </section>

    <details class="sec" data-fold="macro">
        <summary><h2 class="sec-title">MACRO <span class="fold-hint"></span></h2></summary>
        <div class="sectors" id="macro"></div>
    </details>

    <details class="sec" data-fold="earnings">
        <summary><h2 class="sec-title">EARNINGS <span class="fold-hint"></span></h2></summary>
        <div class="earns" id="earnings"></div>
    </details>

    <details class="warns" id="warns" hidden></details>

</main>

<script>
/* =========================================================
   설정
   ========================================================= */

// 색이 가장 진해지는 변화폭 (이 값 이상이면 최대 농도)
const CAP = {
    market: { m1: 15, y1: 50, y2: 100 },   // MARKET: 변화율 %
    pct:    { m1: 5,  y1: 15, y2: 30 },    // MACRO kind=pct: 변화율 %
    pp:     { m1: .5, y1: 1.5, y2: 3 },    // MACRO kind=pp : 변화량 %p
    earn:   20,                            // EARNINGS 전분기 대비 %
};

const LATE_MINUTES = 40;   // 데이터가 이보다 오래되면 상단 시각을 빨갛게 (Actions 멈춤 확인용)

// 종목 로고: 순서대로 시도, 모두 실패하면 글자 아이콘
const LOGO_URLS = t => [
    `https://assets.parqet.com/logos/symbol/${encodeURIComponent(t)}?format=png`,
    `https://financialmodelingprep.com/image-stock/${encodeURIComponent(t)}.png`,
];

// 로고가 없는 자산은 직접 만든 아이콘
const SPECIAL_ICONS = {
    "BTC-USD": ["₿", "#f7931a", "#fff"], "GC=F": ["Au", "#d4af37", "#3a2e00"],
    "SI=F": ["Ag", "#c3cad4", "#232830"], "HG=F": ["Cu", "#b87333", "#fff"],
    "CL=F": ["Oil", "#3a3f47", "#fff"], "NG=F": ["Gas", "#2a6f97", "#fff"],
};


/* =========================================================
   공통 함수
   ========================================================= */

const $ = id => document.getElementById(id);
const nowSec = () => Math.floor(Date.now() / 1000);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function safe(fn) { try { fn(); } catch (e) { console.error(e); } }   // 한 영역이 깨져도 나머지는 표시

const ok = v => v != null && isFinite(v);
const pct = (v, base) => ok(v) && ok(base) && Number(base) !== 0 ? (v - base) / base * 100 : null;
const num = (v, d) => Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d, unit = "") => ok(v) ? (v > 0 ? "+" : "") + v.toFixed(d) + unit : "-";
const dirClass = v => !ok(v) || v === 0 ? "" : (v > 0 ? "up" : "down");

function fmtPrice(p, cur) {
    if (!ok(p)) return "-";
    if (cur === "KRW") return "₩" + num(p, 0);
    return "$" + num(p, p >= 10000 ? 0 : 2);
}

function fmtTurnover(v, cur) {
    if (!ok(v) || v <= 0) return "";
    if (cur === "KRW") return v >= 1e12 ? (v / 1e12).toFixed(2) + "조원" : num(Math.round(v / 1e8), 0) + "억원";
    if (v >= 1e9) return (v / 1e9).toFixed(1) + "B";
    if (v >= 1e6) return (v / 1e6).toFixed(0) + "M";
    return (v / 1e3).toFixed(0) + "K";
}

function fmtMoney(v) {          // 매출
    if (!ok(v)) return "-";
    const a = Math.abs(v);
    if (a >= 1e12) return "$" + (v / 1e12).toFixed(2) + "T";
    if (a >= 1e9) return "$" + (v / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(0) + "M";
    return "$" + num(v, 0);
}

// 변동 크기 → 칩 색 (흰 바탕용)
function tint(v, cap) {
    if (!ok(v)) return ["#eceff3", "#a0a8b4"];
    if (v === 0) return ["#eceff3", "#4b5563"];
    const a = 0.12 + Math.min(Math.abs(v) / cap, 1) * 0.8;
    return [`rgba(${v > 0 ? "var(--up)" : "var(--down)"}, ${a.toFixed(2)})`,
            a > 0.55 ? "#fff" : (v > 0 ? "var(--up-t)" : "var(--down-t)")];
}

function chip(label, text, v, cap) {
    const [bg, fg] = tint(v, cap);
    return `<span class="chip" style="background:${bg};color:${fg}"><i>${label}</i>${text}</span>`;
}


/* ---------- 시간 (한국시간 기준) ---------- */

const WD = ["일", "월", "화", "수", "목", "금", "토"];

function kst(ts) {               // ts(초) → 한국시간 구성요소
    const d = new Date((ts + 9 * 3600) * 1000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay(),
             hh: d.getUTCHours(), mm: d.getUTCMinutes(), day: Math.floor((ts + 9 * 3600) / 86400) };
}
const p2 = n => String(n).padStart(2, "0");
const mmdd = k => `${p2(k.m)}/${p2(k.d)}`;

function dday(ev) {              // 한국 달력 기준 D-n (ts 없으면 미국 현지 날짜 기준)
    if (ev.ts) return kst(ev.ts).day - kst(nowSec()).day;
    if (!ev.date) return null;
    const t = Date.parse(ev.date + "T00:00:00Z") / 1000;
    return Math.floor(t / 86400) - kst(nowSec()).day;
}
const ddLabel = d => d == null ? "-" : (d <= 0 ? "D-Day" : "D-" + d);

function leftLabel(ts) {         // "2일 4시간" / "3시간 12분"
    const s = ts - nowSec();
    if (s <= 0) return "";
    const D = Math.floor(s / 86400), H = Math.floor(s % 86400 / 3600), M = Math.floor(s % 3600 / 60);
    if (D > 0) return `${D}일 ${H}시간`;
    if (H > 0) return `${H}시간 ${M}분`;
    return `${Math.max(M, 1)}분`;
}

function whenLabel(ev) {         // 긴 표기 / 짧은 표기(모바일)
    if (!ev.ts) {
        const [, m, d] = (ev.date || "--").split("-");
        const s = `${m}/${d}`;
        return { full: s + " (미국)", short: s };
    }
    const k = kst(ev.ts), hm = `${p2(k.hh)}:${p2(k.mm)}`, left = leftLabel(ev.ts);
    return {
        full: `${mmdd(k)}(${WD[k.wd]}) ${hm}` + (left ? ` · ${left}` : ""),
        short: dday(ev) <= 0 && left ? left : `${mmdd(k)} ${hm}`,
    };
}


/* ---------- 아이콘 ---------- */

function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

function logoErr(img) {
    const urls = LOGO_URLS(img.dataset.t), i = Number(img.dataset.i) + 1;
    if (i < urls.length) { img.dataset.i = i; img.src = urls[i]; } else img.remove();
}

function icon(ticker, label) {
    const sp = SPECIAL_ICONS[ticker];
    if (sp) return `<span class="ico" style="background:${sp[1]};color:${sp[2]}">${sp[0]}</span>`;
    const h = hue(ticker || label);
    const letters = esc((label || ticker).replace(/[^A-Za-z0-9가-힣]/g, "").slice(0, 2).toUpperCase());
    const img = !ticker || /\.(KS|KQ)$|[\^=]/.test(ticker) ? "" :
        `<img alt="" loading="lazy" data-t="${esc(ticker)}" data-i="0" src="${LOGO_URLS(ticker)[0]}" onload="this.classList.add('ok')" onerror="logoErr(this)">`;
    return `<span class="ico" style="background:hsl(${h} 55% 91%);color:hsl(${h} 55% 30%)">${letters}${img}</span>`;
}


// MACRO 아이콘 글자
const MACRO_GLYPH = { "US M2": "$", "USD/KRW": "₩", "USD/JPY": "¥", "VIX": "V", "S&P 500 Fwd EY": "EY",
                      "HY Spread": "HY", "BBB Spread": "BB" };
function macroIcon(name) {
    const g = MACRO_GLYPH[name] || (/Rate|^US \d/.test(name) ? "%" : name.slice(0, 2));
    const h = hue(name);
    return `<span class="ico" style="background:hsl(${h} 50% 91%);color:hsl(${h} 55% 30%);font-size:10px">${esc(g)}</span>`;
}


/* ---------- 접기 상태 기억 (이 기기·브라우저에서만) ---------- */

function foldInit(el, key, defaultOpen) {
    let saved = null;
    try { saved = localStorage.getItem("fold:" + key); } catch (e) {}
    el.open = saved == null ? defaultOpen : saved === "1";
    el.addEventListener("toggle", () => {
        try { localStorage.setItem("fold:" + key, el.open ? "1" : "0"); } catch (e) {}
    });
}


/* =========================================================
   카드 (MARKET · MACRO 공통)
   ========================================================= */

function cardHTML({ ico, name, stale, price, sub, dayText, dayV, chips }) {
    return `
    <div class="card">
        <div class="c-r1">${ico}<span class="c-name">${esc(name)}${stale ? '<span class="stale">지연</span>' : ""}</span><span class="c-price">${price}</span></div>
        <div class="c-r2"><span class="c-sub">${sub}</span><span class="c-day ${dirClass(dayV)}">${dayText}</span></div>
        <div class="chips">${chips}</div>
    </div>`;
}

function sectorHTML(title, cardsHtml, count, folded, key) {
    const n = Math.min(count, 4);
    const head = `<span class="s-name">${esc(title)}</span>`;
    const body = `<div class="cards n${n}" style="--n:${n}">${cardsHtml}</div>`;
    if (!folded) return `<div class="sector"><div class="s-head">${head}</div>${body}</div>`;
    return `<details class="sector" data-fold="${esc(key)}"><summary class="s-head">${head}<span class="fold-hint"></span></summary>${body}</details>`;
}


/* =========================================================
   렌더링
   ========================================================= */

function renderTop(data) {
    $("top").innerHTML = (data.top || []).filter(t => ok(t.value)).map(t =>
        `<span class="tv"><b>${esc(t.name)}</b><span>${esc(t.prefix || "")}${num(t.value, t.digits ?? 2)}${esc(t.suffix || "")}</span></span>`
    ).join("");

    const late = data.updated_ts && nowSec() - data.updated_ts > LATE_MINUTES * 60;
    $("upd").textContent = (data.updated_at || "-").replace(/^\d{4}-/, "") + (late ? " 지연" : "");
    $("upd").className = "upd" + (late ? " late" : "");
}


function renderEvents(events) {
    const list = (events || []).filter(e => e.ts ? e.ts > nowSec() : dday(e) >= 0);
    if (!list.length) { $("events").innerHTML = `<div class="empty">예정된 이벤트 없음</div>`; return; }

    $("events").innerHTML = list.map(e => {
        const d = dday(e), w = whenLabel(e);
        const tag = e.kind === "earn" ? "실적" : (e.kind === "ipo" ? "IPO" : "");
        const soon = d != null && d <= 3;
        return `
        <div class="ev k-${esc(e.kind)}${soon ? " soon" : ""}">
            <div class="ev-r1"><span class="ev-name">${tag ? `<span class="ev-tag">${tag}</span>` : ""}${esc(e.name)}</span><span class="ev-dd">${ddLabel(d)}</span></div>
            <div class="ev-r2"><span class="full">${w.full}</span><span class="short">${w.short}</span></div>
        </div>`;
    }).join("");
}


function renderMarket(market) {
    const html = (market || []).filter(s => s.items && s.items.length).map(s => {
        const cards = s.items.map(it => {
            const day = pct(it.price, it.prev);
            const m1 = pct(it.price, it.m1), y1 = pct(it.price, it.y1), y2 = pct(it.price, it.y2);
            const sub = [it.theme, fmtTurnover(it.turnover, it.currency)].filter(Boolean).map(esc).join(" · ") || "&nbsp;";
            return cardHTML({
                ico: icon(it.ticker, it.name), name: it.name, stale: it.stale,
                price: fmtPrice(it.price, it.currency), sub,
                dayText: signed(day, 2, "%"), dayV: day,
                chips: chip("1M", signed(m1, 1, "%"), m1, CAP.market.m1)
                     + chip("1Y", signed(y1, 1, "%"), y1, CAP.market.y1)
                     + chip("2Y", signed(y2, Math.abs(y2) >= 100 ? 0 : 1, "%"), y2, CAP.market.y2),
            });
        }).join("");
        return sectorHTML(s.sector, cards, s.items.length, s.folded, "sector:" + s.sector);
    }).join("");

    $("market").innerHTML = html || `<div class="empty">데이터 없음 (Actions 를 한 번 실행해 주세요)</div>`;
    $("market").querySelectorAll("details[data-fold]").forEach(el => foldInit(el, el.dataset.fold, false));
}


function renderMacro(macro) {
    const html = (macro || []).map(g => {
        const cards = (g.items || []).map(it => {
            const dg = it.digits ?? 2, cap = it.kind === "pp" ? CAP.pp : CAP.pct;
            const val = v => ok(v) ? esc(it.prefix || "") + num(v, dg) + esc(it.suffix || "") : "-";
            const chg = base => !ok(it.value) || !ok(base) ? null : (it.kind === "pp" ? it.value - base : pct(it.value, base));
            const day = ok(it.value) && ok(it.prev) ? it.value - it.prev : null;   // 전일 대비 '값' 증감
            return cardHTML({
                ico: macroIcon(it.name), name: it.name, stale: it.stale,
                price: val(it.value), sub: esc(it.desc || ""),
                dayText: ok(day) ? signed(day, dg, it.suffix || "") : "", dayV: day,
                chips: chip("1M", val(it.m1), chg(it.m1), cap.m1)
                     + chip("1Y", val(it.y1), chg(it.y1), cap.y1)
                     + chip("2Y", val(it.y2), chg(it.y2), cap.y2),
            });
        }).join("");
        return sectorHTML(g.group, cards, (g.items || []).length, false);
    }).join("");
    $("macro").innerHTML = html || `<div class="empty">데이터 없음</div>`;
}


// EARNINGS 한 칸: 값 / 전분기 대비(색) / 예상 대비
function qCell(item, prev, fmt, isNext) {
    if (!item || !ok(item.act)) return `<td${isNext ? ' class="next"' : ""}>-</td>`;
    const qoq = ok(prev) && prev !== 0 ? pct(item.act, prev) : null;
    const [bg, fg] = tint(qoq, CAP.earn);
    const qoqHtml = ok(qoq) ? `<div><span class="q-c" style="background:${bg};color:${fg}">${signed(qoq, 1, "%")}</span></div>` : "";
    let sur = "";
    if (!isNext && ok(item.est) && Number(item.est) !== 0) {
        const s = (item.act - item.est) / Math.abs(item.est) * 100;
        sur = `<div class="q-s ${dirClass(s)}">${s > 0 ? "▲" : (s < 0 ? "▼" : "")}${Math.abs(s).toFixed(1)}%</div>`;
    }
    return `<td${isNext ? ' class="next"' : ""}><div class="q-v">${fmt(item.act)}</div>${qoqHtml}${sur}</td>`;
}

function qRow(e, key, fmt) {
    const qs = (e.quarters || []).slice(-3).map(q => ({ act: q[key + "_act"], est: q[key + "_est"] }));
    while (qs.length < 3) qs.unshift(null);
    const items = [...qs, { act: e[key + "_est"] }];
    return items.map((it, i) => qCell(it, i ? (items[i - 1] || {}).act : null, fmt, i === 3)).join("");
}

function renderEarnings(earnings) {
    const list = (earnings || []).filter(e => !e.ts || e.ts > nowSec() - 86400);
    if (!list.length) { $("earnings").innerHTML = `<div class="empty">데이터 없음</div>`; return; }

    const fmtEps = v => ok(v) ? "$" + num(v, 2) : "-";
    $("earnings").innerHTML = list.map(e => {
        const d = e.date ? dday(e) : null, w = e.date ? whenLabel(e) : null;
        const labels = (e.quarters || []).slice(-3).map(q => (q.label || "").replace(/^(\d)Q\d\d(\d\d)$/, "$1Q$2"));
        while (labels.length < 3) labels.unshift("");
        return `
        <div class="ecard${d != null && d <= 7 ? " soon" : ""}">
            <div class="e-head">
                <span class="e-sym">${esc(e.symbol)}</span><span class="e-co">${esc(e.name)}${e.stale ? '<span class="stale">지연</span>' : ""}</span>
                <span class="e-when">${w ? w.full : "일정 미정"}</span><span class="e-dd">${ddLabel(d)}</span>
            </div>
            <table class="etbl">
                <tr><th class="rowh"></th>${labels.map(l => `<th>${esc(l)}</th>`).join("")}<th>다음 예상</th></tr>
                <tr><th class="rowh">EPS</th>${qRow(e, "eps", fmtEps)}</tr>
                <tr><th class="rowh">매출</th>${qRow(e, "rev", fmtMoney)}</tr>
            </table>
        </div>`;
    }).join("");
}


function renderWarnings(warnings) {
    const el = $("warns");
    if (!warnings || !warnings.length) { el.hidden = true; return; }
    el.innerHTML = `<summary>데이터 수집 경고 ${warnings.length}건</summary><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`;
    el.hidden = false;
}


/* =========================================================
   시작
   ========================================================= */

document.querySelectorAll("main > details[data-fold]").forEach(el => foldInit(el, el.dataset.fold, false));

fetch("data.json?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => {
        safe(() => renderTop(data));
        safe(() => renderEvents(data.events));
        safe(() => renderMarket(data.market));
        safe(() => renderMacro(data.macro));
        safe(() => renderEarnings(data.earnings));
        safe(() => renderWarnings(data.warnings));

        setInterval(() => {                    // 남은 시간 · 지연 표시 1분마다 갱신
            safe(() => renderTop(data));
            safe(() => renderEvents(data.events));
            safe(() => renderEarnings(data.earnings));
        }, 60000);
    })
    .catch(err => {
        $("events").innerHTML = `<div class="empty">data.json 을 불러오지 못했습니다 (${esc(err.message)}). Actions 실행 결과를 확인해 주세요.</div>`;
    });
</script>
</body>
</html>
