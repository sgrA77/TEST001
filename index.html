<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Market Dashboard</title>
</head>

<body>
    <h1>MARKET DASHBOARD</h1>

    <div id="stocks"></div>

    <script>
        fetch("data.json?t=" + Date.now())
            .then(r => r.json())
            .then(data => {
                for (const [name, s] of Object.entries(data)) {
                    const price = Number(s.price);

                    document.getElementById("stocks").innerHTML += `
                        <h2>${name}</h2>
                        <h1>${price.toFixed(2)}</h1>
                        <p>전일: ${change(price, s.previous_day)}</p>
                        <p>전주: ${change(price, s.previous_week)}</p>
                        <p>전월: ${change(price, s.previous_month)}</p>
                        <p>전년: ${change(price, s.previous_year)}</p>
                    `;
                }
            });

        function change(price, ref) {
            return ((price - Number(ref)) / Number(ref) * 100).toFixed(2) + "%";
        }
    </script>
</body>
</html>
