<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color: #1a1a1a;
    background: #f4f5f7;
    margin: 0;
}

.topbar {
    background: #fff;
    border-bottom: 1px solid #e2e2e2;
    padding: 14px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topbar-title { font-size: 16px; font-weight: 700; }
.updated-at { font-size: 12px; color: #999; }

.layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    padding: 20px 32px;
    align-items: start;
}

@media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 20px;
}

.panel {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 14px 16px;
}

.panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 10px;
}

.main {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #222;
    margin-bottom: 12px;
    padding-bottom: 6px;
}

h2.section-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #555;
    margin: 0;
}

.range-toggle { display: flex; gap: 4px; }

.range-toggle button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
    color: #666;
    cursor: pointer;
}

.range-toggle button.active {
    background: #222;
    color: #fff;
    border-color: #222;
}

.theme-label {
    font-size: 12px;
    color: #888;
    margin: 14px 0 6px;
    font-weight: 600;
}

.theme-label.category { font-size: 13px; color: #333; margin-top: 22px; }
.theme-label.category:first-child { margin-top: 0; }

.grid { display: flex; flex-wrap: wrap; gap: 10px; }

.card {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 120px;
}

.card.leveraged { border-left: 3px solid #e08a2c; }

.lev-tag {
    font-size: 10px;
    color: #e08a2c;
    font-weight: 600;
    margin-top: 2px;
}

.indicator-name { font-size: 11px; color: #666; }
.indicator-value { font-size: 16px; font-weight: 700; margin-top: 2px; }

.ticker { font-size: 13px; font-weight: 700; }
.price { font-size: 17px; font-weight: 700; margin: 3px 0; }

.change-badge {
    display: inline-block;
    margin-right: 3px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
}

.event-row {
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
}
.event-row:last-child { border-bottom: none; }

.event-row .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.event-row .event-name { font-weight: 600; color: #333; }
.event-row .event-date { color: #888; }
.event-row .event-hours { color: #e08a2c; font-weight: 600; margin-left: 8px; }
.event-row .event-note { color: #999; margin-top: 2px; font-size: 11px; }

.trend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
}
.trend-row:last-child { border-bottom: none; }

.trend-rank { width: 18px; font-weight: 700; color: #aaa; font-size: 11px; }
.trend-symbol { font-weight: 700; width: 56px; }
.trend-price { width: 64px; text-align: right; }
.trend-change { text-align: right; flex: 1; }

.ai-trend-card {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
}

.ai-trend-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.ai-trend-desc { font-size: 12px; color: #666; margin-bottom: 10px; }

.ai-ticker-row { display: flex; flex-wrap: wrap; gap: 8px; }

.ai-ticker-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f7f7f8;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 11px;
}

.ai-ticker-chip .sym { font-weight: 700; }
.ai-ticker-chip .cap { color: #999; }
</style>
</head>

<body>

<div class="topbar">
    <div class="topbar-title">Market Dashboard</div>
    <div class="updated-at" id="updated-at"></div>
</div>

<div class="layout">

    <div class="sidebar">

        <div class="panel">
            <div class="panel-title">Indicators</div>
            <div id="indicators"></div>
        </div>

        <div class="panel">
            <div class="panel-title">🔥 Trending Now</div>
            <div id="trending"></div>
        </div>

        <div class="panel">
            <div class="panel-title">Market Events</div>
            <div id="events"></div>
        </div>

        <div class="panel">
            <div class="panel-title">AI Events</div>
            <div id="ai-events"></div>
        </div>

    </div>

    <div class="main">

        <div>
            <div class="section-header">
                <h2 class="section-title">Stocks</h2>
                <div style="font-size:11px;color:#999;">1D · 1M · 1Y</div>
            </div>
            <div id="stocks"></div>
        </div>

        <div>
            <div class="section-header">
                <h2 class="section-title">AI Trends</h2>
            </div>
            <div id="ai-trends"></div>
        </div>

    </div>

</div>

<script>

let currentRange = "day";
let latestStocks = null;

fetch("data.json?t=" + Date.now())
.then(r => r.json())
.then(data => {

    document.getElementById("updated-at").textContent =
        "Last updated: " + new Date().toLocaleString();

    latestStocks = data.stocks;

    renderIndicators(data.indicators);
    renderTrending(data.trending);
    renderEvents(data.events);
    renderAiEvents(data.ai_events);
    renderStocks(latestStocks, currentRange);
    renderAiTrends(data.ai_trends);
});


document.getElementById("range-toggle").addEventListener("click", (e) => {

    const btn = e.target.closest("button[data-range]");
    if (!btn) return;

    currentRange = btn.dataset.range;

    document
        .querySelectorAll("#range-toggle button")
        .forEach(b => b.classList.toggle("active", b === btn));

    if (latestStocks) {
        renderStocks(latestStocks, currentRange);
    }
});


function renderIndicators(indicatorsByCategory) {

    const root = document.getElementById("indicators");

    for (const [category, items] of Object.entries(indicatorsByCategory)) {

        appendThemeLabel(root, category);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const [name, s] of Object.entries(items)) {

            if (s.value == null) continue;

            grid.innerHTML += `
            <div class="card">
                <div class="indicator-name">${name}</div>
                <div class="indicator-value">${Number(s.value).toFixed(2)}</div>
            </div>`;
        }

        root.appendChild(grid);
    }
}


function renderTrending(trending) {

    const root = document.getElementById("trending");

    if (!trending || trending.length === 0) {
        root.innerHTML = `<div style="font-size:12px;color:#999;">데이터 없음</div>`;
        return;
    }

    for (const s of trending) {

        const p = Number(s.price);

        root.innerHTML += `
        <div class="trend-row">
            <div class="trend-rank">${s.rank}</div>
            <div class="trend-symbol">${s.symbol}</div>
            <div class="trend-price">${p.toFixed(2)}</div>
            <div class="trend-change">${changeBadge(p, s.previous_day)}</div>
        </div>`;
    }
}


function renderEvents(events) {

    const root = document.getElementById("events");

    for (const e of events) {

        const [md, time] = e.date.split(" ");
        const [month, day] = md.split("/");
        const [hour, minute] = time.split(":");

        const year = new Date().getFullYear();
        const eventDate = new Date(`${year}-${month}-${day}T${hour}:${minute}:00+09:00`);
        const now = new Date();
        const hours = Math.ceil((eventDate - now) / (1000 * 60 * 60));

        if (!Number.isFinite(hours) || hours <= 0) continue;

        root.innerHTML += `
        <div class="event-row">
            <div class="row-top">
                <span class="event-name">${e.name}</span>
                <span class="event-date">${e.date}</span>
            </div>
            <span class="event-hours">${hours}h</span>
        </div>`;
    }
}


function renderAiEvents(aiEvents) {

    const root = document.getElementById("ai-events");

    if (!aiEvents || aiEvents.length === 0) {
        root.innerHTML = `<div style="font-size:12px;color:#999;">예정된 이벤트 없음</div>`;
        return;
    }

    for (const e of aiEvents) {

        const dateLabel = e.ongoing ? "진행중" : (e.date || "");

        root.innerHTML += `
        <div class="event-row">
            <div class="row-top">
                <span class="event-name">${e.name}</span>
                <span class="event-date">${dateLabel}</span>
            </div>
            <div class="event-note">${e.note || ""}</div>
        </div>`;
    }
}


const RANGE_CONFIG = {
    day:   { key: "previous_day",   label: "1일" },
    week:  { key: "previous_week",  label: "1주" },
    month: { key: "previous_month", label: "1개월" },
    year:  { key: "previous_year",  label: "1년" },
};

function renderStocks(stocksByCategory, range) {

    const root = document.getElementById("stocks");
    root.innerHTML = "";

    const { key: refKey, label: refLabel } = RANGE_CONFIG[range];

    for (const [category, themes] of Object.entries(stocksByCategory)) {

        appendThemeLabel(root, category, "category");

        for (const [theme, items] of Object.entries(themes)) {

            if (theme !== category) {
                appendThemeLabel(root, theme);
            }

            const grid = document.createElement("div");
            grid.className = "grid";

            for (const [name, s] of Object.entries(items)) {

                const p = Number(s.price);
                const isLev = !!s.leverage_of;

                grid.innerHTML += `
                <div class="card ${isLev ? "leveraged" : ""}">
                    <div class="ticker">${name}</div>
                    <div class="price">${p.toFixed(2)}</div>
                    <div>
                        ${changeBadge(p, s.previous_day, "1D")}
                        ${changeBadge(p, s.previous_month, "1M")}
                        ${changeBadge(p, s.previous_year, "1Y")}
                    </div>
                    ${isLev ? `<div class="lev-tag">Lv. of ${s.leverage_of}</div>` : ""}
                </div>`;
            }

            root.appendChild(grid);
        }
    }
}


function renderAiTrends(aiTrends) {

    const root = document.getElementById("ai-trends");

    if (!aiTrends) {
        root.innerHTML = `<div style="font-size:12px;color:#999;">데이터 없음</div>`;
        return;
    }

    for (const [keyword, info] of Object.entries(aiTrends)) {

        const chips = (info.tickers || []).map(t => {

            const p = Number(t.price);
            const capLabel = formatMarketCap(t.market_cap);

            return `
            <div class="ai-ticker-chip">
                <span class="sym">${t.symbol}</span>
                <span>${p.toFixed(2)}</span>
                ${changeBadge(p, t.previous_month, "1M")}
                ${changeBadge(p, t.previous_year, "1Y")}
                ${t.market_cap_rank ? `<span class="cap">QQQ #${t.market_cap_rank}</span>` : ""}
                ${capLabel ? `<span class="cap">${capLabel}</span>` : ""}
            </div>`;
        }).join("");

        root.innerHTML += `
        <div class="ai-trend-card">
            <div class="ai-trend-title">${keyword}</div>
            <div class="ai-trend-desc">${info.description} · 최근 7일 ${info.mention_count || 0}건</div>
            <div class="ai-ticker-row">${chips}</div>
        </div>`;
    }
}


function formatMarketCap(v) {

    if (v == null) return "";

    if (v >= 1e12) return (v / 1e12).toFixed(2) + "T";
    if (v >= 1e9)  return (v / 1e9).toFixed(1) + "B";
    if (v >= 1e6)  return (v / 1e6).toFixed(1) + "M";

    return String(v);
}


function appendThemeLabel(root, text, extraClass) {
    const label = document.createElement("div");
    label.className = "theme-label" + (extraClass ? " " + extraClass : "");
    label.textContent = text;
    root.appendChild(label);
}


function changeBadge(p, r, prefixLabel) {

    if (r == null) return `<span class="change-badge">-</span>`;

    const v = (p - Number(r)) / Number(r) * 100;

    const magnitude = Math.min(Math.abs(v), 10) / 10;

    const alpha = 0.12 + magnitude * 0.55;
    const textAlpha = 0.55 + magnitude * 0.45;

    let bg, fg;

    if (v > 0) {
        bg = `rgba(192, 57, 43, ${alpha})`;
        fg = `rgba(120, 20, 10, ${textAlpha})`;
    } else if (v < 0) {
        bg = `rgba(36, 85, 164, ${alpha})`;
        fg = `rgba(15, 45, 100, ${textAlpha})`;
    } else {
        bg = `rgba(150, 150, 150, 0.15)`;
        fg = `#555`;
    }

    const sign = v > 0 ? "+" : "";
    const label = prefixLabel ? `${prefixLabel} ` : "";

    return `<span class="change-badge" style="background:${bg}; color:${fg};">
                ${label}${sign}${v.toFixed(2)}%
            </span>`;
}

</script>

</body>
</html>
