```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MARKET DASHBOARD</title>
</head>
<body>

    <h1>MARKET DASHBOARD</h1>

    <p>SPY: <span id="spy">Loading...</span></p>

    <script>
        fetch("data.json")
            .then(response => response.json())
            .then(data => {
                document.getElementById("spy").textContent = data.SPY;
            })
            .catch(error => {
                document.getElementById("spy").textContent = "Error";
            });
    </script>

</body>
</html>
```
