<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Dashboard</title>

<style>
:root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --line: #dfe3e8;
    --text: #14181f;
    --sub: #6a7280;
    --up: 220, 38, 38;      /* 상승 = 빨강 */
    --down: 37, 99, 235;    /* 하락 = 파랑 */
    --alert: #c2410c;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 28px;
    background: var(--text);
    color: #fff;
}
.topbar .title { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
.topbar .updated { font-size: 13px; color: #aab2bf; }

.wrap { max-width: 1760px; margin: 0 auto; padding: 20px 28px 40px; }

.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px 18px;
}

.panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--text);
}
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.04em; }
.panel-head .note { font-size: 12px; color: var(--sub); }

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 560px;
    gap: 20px;
    margin-top: 20px;
    align-items: start;
}
.side { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 12px; }

@media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; }
}

.empty { color: var(--sub); padding: 8px 0; }
.error {
    margin: 16px 28px 0;
    padding: 12px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 6px;
}

/* ---------- 색 강도 칩 (공통) ---------- */
.chip {
    display: block;
    text-align: center;
    border-radius: 5px;
    padding: 5px 0;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
}

/* ---------- EVENTS ---------- */
.events { display: flex; flex-direction: column; }
.event {
    display: grid;
    grid-template-columns: 1fr auto 72px;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid #edf0f3;
}
.event:first-child { border-top: 0; }
.event .e-name { font-size: 15px; font-weight: 800; }
.event .e-date { font-size: 13px; color: var(--sub); }
.event .e-dday { font-size: 18px; font-weight: 800; text-align: right; }
.event.soon .e-dday { color: var(--alert); }
.event.soon .e-name::before { content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--alert); margin-right: 7px; }

/* ---------- MARKET ---------- */
.market {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    grid-auto-flow: dense;
    gap: 26px 28px;
}
.sector.wide { grid-column: span 2; }
@media (max-width: 1500px) { .sector.wide { grid-column: auto; } }

.sector-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.sector-name { font-size: 15px; font-weight: 800; }
.sector-avg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--sub); }
.sector-avg .chip { padding: 3px 8px; font-size: 12px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fff; }
.c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.c-name { font-size: 16px; font-weight: 800; }
.c-tick { font-size: 11px; color: var(--sub); }
.c-price { font-size: 14px; color: #3a4250; margin: 2px 0 8px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile { border-radius: 5px; padding: 6px 2px 7px; text-align: center; }
.tile .lbl { font-size: 11px; font-weight: 600; opacity: 0.8; }
.tile .val { font-size: 17px; font-weight: 800; }

/* ---------- MACRO ---------- */
.macro-head,
.macro-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 84px 76px 76px 76px;
    gap: 5px;
    gap: 6px;
    align-items: center;
}
.macro-head { font-size: 12px; color: var(--sub); text-align: center; padding-bottom: 4px; }
.macro-row { padding: 4px 0; }
.macro-row .chip { font-size: 12px; padding: 5px 0; letter-spacing: -0.02em; }
.group { font-size: 12px; font-weight: 700; color: var(--sub); margin: 14px 0 2px; }
.m-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
.m-val { font-size: 16px; font-weight: 800; text-align: right; }

/* ---------- EARNINGS ---------- */
.earn-wrap { overflow-x: auto; }
.earn { width: 100%; min-width: 1500px; border-collapse: collapse; }
.earn th {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    text-align: left;
    padding: 0 10px 6px;
}
.earn th.grp { text-align: center; color: var(--text); border-bottom: 1px solid var(--line); }
.earn td { padding: 9px 10px; border-top: 1px solid #edf0f3; vertical-align: middle; font-size: 14px; }
.earn .qcol { border-left: 1px solid #edf0f3; }
.earn tr.soon td { background: #fff7ed; }
.earn tr.none td { color: #a0a7b2; }

.t-sym { font-weight: 800; font-size: 15px; }
.t-co { font-size: 11px; color: var(--sub); }
.t-dday { font-weight: 800; font-size: 15px; }
.earn tr.soon .t-dday { color: var(--alert); }
.t-est { font-weight: 700; }

.earn th.sub { text-align: center; font-weight: 600; padding-bottom: 4px; }
.earn td.tc { text-align: center; padding: 6px 4px; }
.earn .gcol { border-left: 2px solid var(--line); }
.q-lbl { font-size: 11px; font-weight: 700; color: var(--sub); }
.q-val { font-size: 15px; font-weight: 800; line-height: 1.25; }
.q-est { font-size: 11px; color: var(--sub); white-space: nowrap; }
.q-est .sur { font-size: 11px; font-weight: 700; margin-left: 3px; }
.qoq { display: inline-block; margin-top: 2px; padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 700; }
.q-next { background: #f3f6fb; border-radius: 6px; }
.q-next .q-val { font-weight: 700; }
.tag-stale { font-size: 10px; font-weight: 600; color: #b45309; background: #fef3c7;
             border-radius: 3px; padding: 0 4px; margin-left: 5px; vertical-align: middle; }
.up { color: rgb(var(--up)); }
.down { color: rgb(var(--down)); }
</style>
</head>

<body>

<div class="topbar">
    <div class="title">Market Dashboard</div>
    <div class="updated" id="updated"></div>
</div>

<div class="wrap">

    <div class="layout">

        <section class="panel">
            <div class="panel-head">
                <h2>MARKET</h2>
                <span class="note">1M·1Y = 전월 말 · 전년 말 종가 대비 · 상승 빨강 · 하락 파랑</span>
            </div>
            <div class="market" id="market"></div>
        </section>

        <aside class="side">

            <section class="panel">
                <div class="panel-head">
                    <h2>MACRO</h2>
                    <span class="note">1M·1Y·2Y = 전월 말 · 전년 말 · 재작년 말 대비</span>
                </div>
                <div id="macro"></div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>EVENTS</h2>
                    <span class="note">미국 현지 날짜 기준</span>
                </div>
                <div class="events" id="events"></div>
            </section>

        </aside>

    </div>

    <section class="panel" style="margin-top: 20px;">
        <div class="panel-head">
            <h2>EARNINGS</h2>
            <span class="note">지난 분기: 실제 (예상) · ▲▼ = 예상 대비 · 매출 예상은 저장 시작 이후 분기부터 표시</span>
        </div>
        <div class="earn-wrap" id="earnings"></div>
    </section>

</div>

<script>

/* =========================================================
   설정: 색이 가장 진해지는 변화폭 (이 값 이상이면 최대 농도)
   ========================================================= */
const CAP = {
    market: { m: 15,  y: 50 },   // MARKET 종목: 1M 15%, 1Y 50%
    pct:    { m: 5,   y: 15,  y2: 30 },   // MACRO (변화율 %)
    pp:     { m: 0.5, y: 1.5, y2: 3 },  // MACRO (변화량 %p)
    earn:   20,                  // EARNINGS 전분기 대비 증감 20%
};


const $ = id => document.getElementById(id);

function safe(fn) {
    try { fn(); }
    catch (e) { console.error(e); }   // 한 영역이 깨져도 나머지는 그대로 표시
}


/* ---------- 계산 / 포맷 ---------- */

function pctChange(price, base) {
    if (price == null || base == null || Number(base) === 0) return null;
    return (price - base) / base * 100;
}

function signed(v, digits, unit) {
    if (v == null || !isFinite(v)) return "-";
    return (v > 0 ? "+" : "") + v.toFixed(digits) + unit;
}

function num(v, digits) {
    return Number(v).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
    });
}

function fmtPrice(s) {
    if (s.price == null) return "-";
    if (s.currency === "KRW") return "₩" + num(s.price, 0);
    return "$" + num(s.price, 2);
}

function fmtRevenue(v) {
    if (v == null) return "-";
    if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    return "$" + (v / 1e6).toFixed(0) + "M";
}

function mmdd(iso) {
    return iso ? iso.slice(5).replace("-", "/") : "-";
}

function ddayLabel(d) {
    if (d == null) return "-";
    return d === 0 ? "D-Day" : "D-" + d;
}


/* ---------- 색 강도 ---------- */

function tint(v, cap) {
    if (v == null || !isFinite(v)) return { bg: "#eceff3", fg: "#9aa1ab" };
    if (v === 0) return { bg: "#e5e8ec", fg: "#555c68" };

    const a = 0.10 + Math.min(Math.abs(v) / cap, 1) * 0.85;
    const rgb = v > 0 ? "var(--up)" : "var(--down)";
    const fg = a > 0.5 ? "#fff" : (v > 0 ? "#991b1b" : "#1e40af");

    return { bg: `rgba(${rgb}, ${a.toFixed(2)})`, fg };
}

function chip(v, cap, text) {
    const t = tint(v, cap);
    return `<span class="chip" style="background:${t.bg};color:${t.fg}">${text}</span>`;
}

function tile(label, v, cap) {
    const t = tint(v, cap);
    return `<div class="tile" style="background:${t.bg};color:${t.fg}">
                <div class="lbl">${label}</div>
                <div class="val">${signed(v, 1, "%")}</div>
            </div>`;
}


/* ---------- EVENTS ---------- */

function renderEvents(events) {

    const list = (events || []).filter(e => e.d_day != null && e.d_day >= 0);

    if (!list.length) {
        $("events").innerHTML = `<div class="empty">예정된 이벤트 없음</div>`;
        return;
    }

    $("events").innerHTML = list.map(e => `
        <div class="event ${e.d_day <= 7 ? "soon" : ""}">
            <div class="e-name">${e.name}</div>
            <div class="e-date">${mmdd(e.date)}</div>
            <div class="e-dday">${ddayLabel(e.d_day)}</div>
        </div>`).join("");
}


/* ---------- MARKET ---------- */

function renderMarket(market) {

    const root = $("market");
    root.innerHTML = "";

    for (const [sector, items] of Object.entries(market || {})) {

        const entries = Object.entries(items);
        if (!entries.length) continue;

        const changes = entries.map(([, s]) => ({
            m: pctChange(s.price, s.prev_month),
            y: pctChange(s.price, s.prev_year),
        }));

        const avg = key => {
            const xs = changes.map(c => c[key]).filter(v => v != null);
            return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
        };
        const avgM = avg("m"), avgY = avg("y");

        const cards = entries.map(([name, s], i) => {
            const showTicker = s.ticker && !name.startsWith(s.ticker);
            return `
            <div class="card">
                <div class="c-top">
                    <span class="c-name">${name}</span>
                    ${showTicker ? `<span class="c-tick">${s.ticker}</span>` : ""}
                </div>
                <div class="c-price">${fmtPrice(s)}</div>
                <div class="tiles">
                    ${tile("1M", changes[i].m, CAP.market.m)}
                    ${tile("1Y", changes[i].y, CAP.market.y)}
                </div>
            </div>`;
        }).join("");

        root.insertAdjacentHTML("beforeend", `
        <div class="sector ${entries.length >= 4 ? "wide" : ""}">
            <div class="sector-head">
                <span class="sector-name">${sector}</span>
                <span class="sector-avg">평균
                    <span class="chip">${signed(avgM, 1, "%")}</span>
                    <span class="chip">${signed(avgY, 1, "%")}</span>
                </span>
            </div>
            <div class="cards">${cards}</div>
        </div>`);

        // 평균 칩 색상 (방금 추가한 섹터의 칩 2개)
        const chips = root.lastElementChild.querySelectorAll(".sector-avg .chip");
        [[chips[0], avgM, CAP.market.m], [chips[1], avgY, CAP.market.y]].forEach(([el, v, cap]) => {
            const t = tint(v, cap);
            el.style.background = t.bg;
            el.style.color = t.fg;
        });
    }

    if (!root.children.length) {
        root.innerHTML = `<div class="empty">데이터 없음 (Actions를 한 번 실행해 주세요)</div>`;
    }
}


/* ---------- MACRO ---------- */

function renderMacro(macro) {

    const groups = Object.entries(macro || {});

    if (!groups.length) {
        $("macro").innerHTML = `<div class="empty">데이터 없음</div>`;
        return;
    }

    let html = `<div class="macro-head"><span></span><span>현재</span><span>1M</span><span>1Y</span><span>2Y</span></div>`;

    for (const [group, items] of groups) {

        html += `<div class="group">${group}</div>`;

        for (const [name, s] of Object.entries(items)) {

            const isPP = s.kind === "pp";
            const cap = isPP ? CAP.pp : CAP.pct;
            const unit = isPP ? "%p" : "%";

            const diff = base => {
                if (s.value == null || base == null) return null;
                return isPP ? s.value - base : pctChange(s.value, base);
            };
            const m = diff(s.prev_month), y = diff(s.prev_year), y2 = diff(s.prev_2year);

            const digits = s.digits != null ? s.digits : 2;
            const value = s.value == null
                ? "-"
                : (s.prefix || "") + num(s.value, digits) + (s.suffix || "");

            html += `
            <div class="macro-row">
                <span class="m-name">${name}${s.stale ? '<span class="tag-stale" title="자동 수집 실패 → 직전/기본값">캐시</span>' : ""}</span>
                <span class="m-val">${value}</span>
                ${chip(m, cap.m, signed(m, 2, unit))}
                ${chip(y, cap.y, signed(y, 2, unit))}
                ${chip(y2, cap.y2, signed(y2, 2, unit))}
            </div>`;
        }
    }

    $("macro").innerHTML = html;
}


/* ---------- EARNINGS ---------- */

function surprise(act, est) {
    if (act == null || est == null || Number(est) === 0) return "";
    const v = (act - est) / Math.abs(est) * 100;
    const cls = v > 0 ? "up" : (v < 0 ? "down" : "");
    const arrow = v > 0 ? "▲" : (v < 0 ? "▼" : "");
    return `<span class="sur ${cls}">${arrow}${Math.abs(v).toFixed(1)}%</span>`;
}

function shortQ(label) {
    // "2Q2025" → "2Q25"
    return (label || "").replace(/^(\d)Q\d\d(\d\d)$/, "$1Q$2");
}

// 한 칸: 분기 라벨 / 값 / 전분기 대비 증감(색) / 예상치 대비 서프라이즈
function trendCell(item, prev, fmt, first) {

    const gcol = first ? " gcol" : "";
    if (!item || item.act == null) return `<td class="tc${gcol}">-</td>`;

    const qoq = prev == null || prev === 0 ? null : pctChange(item.act, prev);
    const t = tint(qoq, CAP.earn);
    const chipHtml = qoq == null ? ""
        : `<div><span class="qoq" style="background:${t.bg};color:${t.fg}">${signed(qoq, 1, "%")}</span></div>`;

    if (item.next) {
        return `<td class="tc${gcol}"><div class="q-next">
            <div class="q-lbl">다음 (예상)</div>
            <div class="q-val">${fmt(item.act)}</div>${chipHtml}</div></td>`;
    }
    const est = item.est == null ? ""
        : `<div class="q-est">예상 ${fmt(item.est)}${surprise(item.act, item.est)}</div>`;
    return `<td class="tc${gcol}">
        <div class="q-lbl">${shortQ(item.label)}</div>
        <div class="q-val">${fmt(item.act)}</div>${chipHtml}${est}</td>`;
}

// key: "eps" | "rev"  → [3분기 전, 2분기 전, 직전, 다음 예상] 4칸
function trendCells(e, key, fmt) {

    const qs = (e.quarters || []).slice(-3).map(q => ({
        label: q.label, act: q[key + "_act"], est: q[key + "_est"],
    }));
    while (qs.length < 3) qs.unshift(null);

    const items = [...qs, { next: true, act: e[key + "_est"] }];

    return items.map((it, i) => {
        // 전 분기 값 (없으면 그 앞 분기)
        const prev = i === 0 ? null : (items[i - 1] ? items[i - 1].act : null);
        return trendCell(it, prev, fmt, i === 0);
    }).join("");
}

function renderEarnings(earnings) {

    const list = (earnings || []).filter(e => e.d_day == null || e.d_day >= 0);

    if (!list.length) {
        $("earnings").innerHTML = `<div class="empty">데이터 없음</div>`;
        return;
    }

    const fmtEps = v => v == null ? "-" : "$" + num(v, 2);

    const rows = list.map(e => {

        const cls = e.d_day == null ? "none" : (e.d_day <= 7 ? "soon" : "");

        return `
        <tr class="${cls}">
            <td>
                <div class="t-sym">${e.symbol}</div>
                <div class="t-co">${e.name || ""}</div>
            </td>
            <td>${mmdd(e.date)}</td>
            <td class="t-dday">${ddayLabel(e.d_day)}</td>
            ${trendCells(e, "eps", fmtEps)}
            ${trendCells(e, "rev", fmtRevenue)}
        </tr>`;
    }).join("");

    const sub = `<th class="sub gcol">3분기 전</th><th class="sub">2분기 전</th><th class="sub">직전 분기</th><th class="sub">다음 예상</th>`;

    $("earnings").innerHTML = `
    <table class="earn">
        <thead>
            <tr>
                <th></th><th></th><th></th>
                <th class="grp gcol" colspan="4">EPS 흐름 · 실제값 / 전분기 대비 / 예상 대비</th>
                <th class="grp gcol" colspan="4">매출 흐름 · 실제값 / 전분기 대비 / 예상 대비</th>
            </tr>
            <tr>
                <th>기업</th><th>날짜</th><th>D-Day</th>
                ${sub}${sub.replace("sub gcol", "sub gcol")}
            </tr>
        </thead>
        <tbody>${rows}</tbody>
    </table>`;
}


/* ---------- 로드 ---------- */

fetch("data.json?t=" + Date.now())
    .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
    })
    .then(data => {
        $("updated").textContent = "Updated " + (data.updated_at || "-");

        safe(() => renderEvents(data.events));
        safe(() => renderMarket(data.market));
        safe(() => renderMacro(data.macro));
        safe(() => renderEarnings(data.earnings));
    })
    .catch(err => {
        document.body.insertAdjacentHTML(
            "afterbegin",
            `<div class="error">data.json을 불러오지 못했습니다 (${err.message}). Actions 실행 결과를 확인해 주세요.</div>`
        );
    });

</script>

</body>
</html>
