<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Dashboard</title>
<style>
/* =========================================================
   Binance 다크 스타일 (배경 #0B0E11 / 패널 #181A20 / 카드 #1E2329 / 포인트 노랑)
   등락 색: 상승 = 빨강, 하락 = 파랑 (강도는 변동폭에 비례)
   ========================================================= */
:root {
    --bg: #0b0e11;
    --panel: #181a20;
    --card: #1e2329;
    --line: #2b3139;
    --text: #eaecef;
    --sub: #848e9c;
    --dim: #5e6673;
    --yellow: #f0b90b;
    --up: 246, 70, 93;       /* 상승 = 빨강 */
    --down: 59, 130, 246;    /* 하락 = 파랑 */
    --up-t: #ff6b7f;         /* 어두운 배경 위 글자색 */
    --down-t: #6cb0ff;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
}
.topbar .title { white-space: nowrap; font-size: 17px; font-weight: 800; letter-spacing: 0.01em; }
.topbar .title::before {
    content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 9px;
    background: var(--yellow); border-radius: 2px; transform: rotate(45deg);
}
.topbar .updated { font-size: 12px; color: var(--sub); }

.wrap { max-width: 1760px; margin: 0 auto; padding: 20px 28px 40px; }

.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px 18px;
}
.panel.gap { margin-top: 18px; }

.panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
}
.panel-head h2 {
    margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.06em;
    padding-left: 10px; border-left: 3px solid var(--yellow);
}
.panel-head .note { font-size: 12px; color: var(--sub); text-align: right; }

.empty { color: var(--sub); padding: 8px 0; }
.error {
    margin: 16px 28px 0; padding: 12px 14px;
    background: #2a1519; border: 1px solid #5a2029; color: #ff8a98; border-radius: 6px;
}

/* ---------- 색 강도 칩 (공통) ---------- */
.chip {
    display: block;
    text-align: center;
    border-radius: 4px;
    padding: 5px 0;
    font-weight: 700;
    font-size: 12.5px;
    white-space: nowrap;
    letter-spacing: -0.02em;
}
.up { color: var(--up-t); }
.down { color: var(--down-t); }

/* ---------- EVENTS ---------- */
.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.event {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 8px;
}
.event.soon { border-left-color: var(--yellow); background: #221f14; }
.event .e-name { font-size: 16px; font-weight: 800; }
.event .e-date { font-size: 12px; color: var(--sub); }
.event .e-dday { font-size: 22px; font-weight: 800; }
.event.soon .e-dday { color: var(--yellow); }

/* ---------- 섹터 / 그룹 블록 ---------- */
.blocks {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-flow: dense;
    gap: 16px;
}
.block { min-width: 0; }
.block.s1 { grid-column: span 1; }
.block.s2 { grid-column: span 2; }
.block.s3 { grid-column: span 3; }
.block.s1 .cards { grid-template-columns: 1fr; }
.block.s2 .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.block.s3 .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.block-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 0 2px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
}
.block-name { font-size: 15px; font-weight: 800; }
.block-avg { display: flex; align-items: center; gap: 4px; }
.block-avg .lbl { font-size: 11px; color: var(--sub); margin-right: 2px; }
.block-avg .chip { padding: 3px 7px; font-size: 11.5px; }
.block-avg .chip i { font-style: normal; font-weight: 600; opacity: .8; margin-right: 4px; font-size: 10px; }

.cards { display: grid; gap: 10px; }

/* ---------- 종목/지표 카드 ----------
   왼쪽: 아이콘 · 이름 · 가격(당일%) / 테마 | 거래대금      오른쪽: 1M · 1Y · 2Y */
.card {
    --cw: 56px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color .15s;
}
.card:hover { border-color: rgba(240, 185, 11, .55); }
.card.macro { --cw: 66px; }

.c-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.c-id { min-width: 0; }
.c-l1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 7px; }
.c-name { font-size: 15.5px; font-weight: 800; color: var(--text); }
.c-price { font-size: 15px; font-weight: 700; }
.c-day { font-size: 12px; font-weight: 700; }
.c-l2 { font-size: 11px; color: var(--sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-l2 .sep { color: var(--dim); margin: 0 5px; }

.c-right { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 3px 4px; flex: none; }
.c-right .h { font-size: 10px; font-weight: 600; color: var(--sub); text-align: center; }

/* 아이콘 */
.ico {
    position: relative; flex: none; overflow: hidden;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
}
.ico img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #fff; padding: 3px; border-radius: 50%;
    opacity: 0;                    /* 로드에 성공했을 때만 보임 */
}
.ico img.ok { opacity: 1; }
.tag-stale { font-size: 10px; font-weight: 600; color: #1e2329; background: var(--yellow);
             border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: middle; }

/* ---------- EARNINGS ---------- */
.earn-wrap { overflow-x: auto; }
.earn { width: 100%; min-width: 1500px; border-collapse: collapse; }
.earn th { font-size: 12px; font-weight: 600; color: var(--sub); text-align: left; padding: 0 10px 6px; }
.earn th.grp { text-align: center; color: var(--text); border-bottom: 1px solid var(--line); }
.earn th.sub { text-align: center; font-weight: 600; padding-bottom: 4px; }
.earn td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
.earn td.tc { text-align: center; padding: 6px 4px; }
.earn .gcol { border-left: 1px solid var(--line); }
.earn tr.soon td { background: rgba(240, 185, 11, .07); }
.earn tr.none td { color: var(--dim); }

.t-sym { font-weight: 800; font-size: 15px; }
.t-co { font-size: 11px; color: var(--sub); }
.t-dday { font-weight: 800; font-size: 15px; }
.earn tr.soon .t-dday { color: var(--yellow); }

.q-lbl { font-size: 11px; font-weight: 700; color: var(--sub); }
.q-val { font-size: 15px; font-weight: 800; line-height: 1.25; }
.q-est { font-size: 11px; color: var(--sub); white-space: nowrap; }
.q-est .sur { font-size: 11px; font-weight: 700; margin-left: 3px; }
.qoq { display: inline-block; margin-top: 2px; padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 700; }
.q-next { background: #222831; border: 1px dashed var(--line); border-radius: 6px; padding: 2px 0; }
.q-next .q-val { font-weight: 700; }

#macro { grid-template-columns: repeat(2, minmax(0, 1fr)); }   /* 지표 그룹은 2×2 */

/* ---------- 태블릿 ---------- */
@media (max-width: 1350px) {
    .blocks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .block.s3 { grid-column: span 2; }
    .block.s3 .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- 모바일 ---------- */
@media (max-width: 760px) {
    .topbar { padding: 11px 14px; }
    .topbar .updated { font-size: 11px; text-align: right; }
    .wrap { padding: 12px 10px 28px; }
    .panel { padding: 12px 10px 14px; }
    .panel-head { flex-direction: column; gap: 3px; }
    .panel-head .note { text-align: left; }

    .blocks, #macro { grid-template-columns: minmax(0, 1fr); }
    .block.s1, .block.s2, .block.s3 { grid-column: auto; }
    .block .cards, .block.s2 .cards, .block.s3 .cards { grid-template-columns: minmax(0, 1fr); }
    .block-head { flex-wrap: wrap; }

    /* 카드: 위 = 종목 정보, 아래 = 1M·1Y·2Y 를 전체 폭으로 */
    .card { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
    .c-right { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .events { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .event { padding: 7px 10px; }
    .event .e-name { font-size: 15px; white-space: nowrap; }
    .event .e-dday { font-size: 19px; white-space: nowrap; }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="title">Market Dashboard</div>
    <div class="updated" id="updated"></div>
</div>

<div class="wrap">

    <section class="panel">
        <div class="panel-head">
            <h2>MACRO</h2>
            <span class="note">1M · 1Y · 2Y = 전월 말 · 전년 말 · 재작년 말 값 · 색 = 현재 대비 변동 (상승 빨강 · 하락 파랑)</span>
        </div>
        <div class="blocks" id="macro"></div>
    </section>

    <section class="panel gap">
        <div class="panel-head">
            <h2>EVENTS</h2>
            <span class="note">미국 현지 날짜 기준</span>
        </div>
        <div class="events" id="events"></div>
    </section>

    <section class="panel gap">
        <div class="panel-head">
            <h2>MARKET</h2>
            <span class="note">가격(당일 %) · 테마 | 거래대금 &nbsp;/&nbsp; 1M · 1Y · 2Y = 전월 말 · 전년 말 · 재작년 말 종가 대비</span>
        </div>
        <div class="blocks" id="market"></div>
    </section>

    <section class="panel gap">
        <div class="panel-head">
            <h2>EARNINGS</h2>
            <span class="note">지난 분기: 실제 (예상) · ▲▼ = 예상 대비 · 매출 예상은 저장 시작 이후 분기부터 표시</span>
        </div>
        <div class="earn-wrap" id="earnings"></div>
    </section>

</div>

<script>

/* =========================================================
   설정: 색이 가장 진해지는 변화폭 (이 값 이상이면 최대 농도)
   ========================================================= */
const CAP = {
    market: { m: 15,  y: 50,  y2: 100 },   // MARKET 종목 (변화율 %)
    pct:    { m: 5,   y: 15,  y2: 30 },    // MACRO (변화율 %)
    pp:     { m: 0.5, y: 1.5, y2: 3 },     // MACRO (변화량 %p)
    earn:   20,                            // EARNINGS 전분기 대비 증감 20%
};

/* 종목 아이콘: 로고 이미지를 순서대로 시도 → 모두 실패하면 글자 아이콘이 그대로 보임 */
const LOGO_URLS = t => [
    `https://assets.parqet.com/logos/symbol/${encodeURIComponent(t)}?format=png`,
    `https://financialmodelingprep.com/image-stock/${encodeURIComponent(t)}.png`,
];

/* 이미지 로고가 없는 자산(코인·원자재 등)은 직접 만든 아이콘 */
const SPECIAL_ICONS = {
    "BTC-USD": { t: "₿",   bg: "#f7931a", fg: "#fff" },
    "GC=F":    { t: "Au",  bg: "#d4af37", fg: "#3a2e00" },
    "SI=F":    { t: "Ag",  bg: "#b8c0cc", fg: "#232830" },
    "HG=F":    { t: "Cu",  bg: "#b87333", fg: "#fff" },
    "CL=F":    { t: "Oil", bg: "#3a3f47", fg: "#eaecef" },
    "NG=F":    { t: "Gas", bg: "#2a6f97", fg: "#fff" },
};

/* MACRO 지표 아이콘 글자 */
const MACRO_DESC = {
    "US M2": "미국 통화량", "USD/KRW": "원 / 달러", "USD/JPY": "엔 / 달러",
    "Korea Policy Rate": "한국은행 기준금리", "US Policy Rate": "연준 기준금리 (목표범위 중간값)",
    "Japan Policy Rate": "일본은행 정책금리",
    "US 3M": "미 국채 3개월", "US 2Y": "미 국채 2년", "US 10Y": "미 국채 10년", "US 30Y": "미 국채 30년",
    "S&P 500 Fwd Earnings Yield": "12개월 선행 이익수익률", "VIX": "변동성 지수",
    "HY Spread": "하이일드 OAS", "BBB Spread": "BBB 회사채 OAS",
};

const MACRO_GLYPH = {
    "US M2": "$", "USD/KRW": "₩", "USD/JPY": "¥", "VIX": "V",
    "S&P 500 Fwd Earnings Yield": "EY", "HY Spread": "HY", "BBB Spread": "BB",
};


const $ = id => document.getElementById(id);

function safe(fn) {
    try { fn(); }
    catch (e) { console.error(e); }   // 한 영역이 깨져도 나머지는 그대로 표시
}


/* ---------- 계산 / 포맷 ---------- */

function pctChange(price, base) {
    if (price == null || base == null || Number(base) === 0) return null;
    return (price - base) / base * 100;
}

function signed(v, digits, unit) {
    if (v == null || !isFinite(v)) return "-";
    return (v > 0 ? "+" : "") + v.toFixed(digits) + unit;
}

function num(v, digits) {
    return Number(v).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
    });
}

function fmtPrice(s) {
    if (s.price == null) return "-";
    if (s.currency === "KRW") return "₩" + num(s.price, 0);
    return "$" + num(s.price, s.price >= 1000 ? 0 : 2);
}

/* 거래대금: 달러는 K/M/B, 원화는 억/조 */
function fmtTurnover(v, currency) {
    if (v == null || !isFinite(v) || v <= 0) return "";
    if (currency === "KRW") {
        if (v >= 1e12) return (v / 1e12).toFixed(2) + "조원";
        return num(Math.round(v / 1e8), 0) + "억원";
    }
    if (v >= 1e9) return (v / 1e9).toFixed(1) + "B USD";
    if (v >= 1e6) return (v / 1e6).toFixed(1) + "M USD";
    return (v / 1e3).toFixed(0) + "K USD";
}

function fmtRevenue(v) {
    if (v == null) return "-";
    if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    return "$" + (v / 1e6).toFixed(0) + "M";
}

function mmdd(iso) {
    return iso ? iso.slice(5).replace("-", "/") : "-";
}

function ddayLabel(d) {
    if (d == null) return "-";
    return d === 0 ? "D-Day" : "D-" + d;
}


/* ---------- 색 강도 (어두운 배경용) ---------- */

function tint(v, cap) {
    if (v == null || !isFinite(v)) return { bg: "#2b3139", fg: "#5e6673" };
    if (v === 0) return { bg: "#2b3139", fg: "#b7bdc6" };

    const a = 0.16 + Math.min(Math.abs(v) / cap, 1) * 0.79;
    const rgb = v > 0 ? "var(--up)" : "var(--down)";
    const fg = a > 0.55 ? "#fff" : (v > 0 ? "var(--up-t)" : "var(--down-t)");

    return { bg: `rgba(${rgb}, ${a.toFixed(2)})`, fg };
}

function chip(v, cap, text) {
    const t = tint(v, cap);
    return `<span class="chip" style="background:${t.bg};color:${t.fg}">${text}</span>`;
}

function dayHTML(text, v) {
    if (v == null || !isFinite(v)) return "";
    return `<span class="c-day ${v > 0 ? "up" : (v < 0 ? "down" : "")}">(${text})</span>`;
}


/* ---------- 아이콘 ---------- */

function hueOf(str) {
    let h = 0;
    for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
}

function logoErr(img) {
    const urls = LOGO_URLS(img.dataset.t);
    const i = Number(img.dataset.i) + 1;
    if (i < urls.length) { img.dataset.i = i; img.src = urls[i]; }
    else img.remove();                       // 전부 실패 → 글자 아이콘만 남음
}

function tickerIcon(ticker, label) {
    const sp = SPECIAL_ICONS[ticker];
    if (sp) return `<span class="ico" style="background:${sp.bg};color:${sp.fg}">${sp.t}</span>`;

    const letters = (label || ticker).replace(/[^A-Za-z0-9가-힣]/g, "").slice(0, 2).toUpperCase();
    const h = hueOf(ticker);
    const isKR = /\.(KS|KQ)$/.test(ticker);   // 한국 종목은 글자 아이콘
    const img = isKR ? "" :
        `<img alt="" loading="lazy" data-t="${ticker}" data-i="0" src="${LOGO_URLS(ticker)[0]}" onload="this.classList.add('ok')" onerror="logoErr(this)">`;

    return `<span class="ico" style="background:hsl(${h} 35% 26%);color:hsl(${h} 75% 84%)">${letters}${img}</span>`;
}

function glyphIcon(name) {
    const g = MACRO_GLYPH[name] || (/Rate/.test(name) ? "%" : (/^US \d/.test(name) ? "%" : name.slice(0, 2).toUpperCase()));
    const h = hueOf(name);
    return `<span class="ico" style="background:hsl(${h} 30% 24%);color:hsl(${h} 70% 82%)">${g}</span>`;
}


/* ---------- 공통 카드 ----------
   cells: [{l:"1M", text:"+5.0%", v:5.0, cap:15}, ...] */

function cardHTML({ cls = "", icon, name, tag = "", price, dayText, dayV, sub, cells }) {
    return `
    <div class="card ${cls}">
        <div class="c-left">
            ${icon}
            <div class="c-id">
                <div class="c-l1">
                    <span class="c-name">${name}${tag}</span>
                    <span class="c-price">${price}</span>
                    ${dayHTML(dayText, dayV)}
                </div>
                <div class="c-l2">${sub}</div>
            </div>
        </div>
        <div class="c-right">
            ${cells.map(c => `<span class="h">${c.l}</span>`).join("")}
            ${cells.map(c => chip(c.v, c.cap, c.text)).join("")}
        </div>
    </div>`;
}

function spanClass(n) {
    return n >= 3 ? "s3" : (n === 2 ? "s2" : "s1");
}

function avgChips(list) {
    // list: [{m,y,y2}, ...] → 평균 칩 3개
    const avg = key => {
        const xs = list.map(c => c[key]).filter(v => v != null);
        return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
    };
    const parts = [["1M", "m", CAP.market.m], ["1Y", "y", CAP.market.y], ["2Y", "y2", CAP.market.y2]];
    return `<span class="lbl">평균</span>` + parts.map(([l, k, cap]) => {
        const v = avg(k), t = tint(v, cap);
        return `<span class="chip" style="background:${t.bg};color:${t.fg}"><i>${l}</i>${signed(v, 1, "%")}</span>`;
    }).join("");
}


/* ---------- EVENTS ---------- */

function renderEvents(events) {

    const list = (events || []).filter(e => e.d_day != null && e.d_day >= 0);

    if (!list.length) {
        $("events").innerHTML = `<div class="empty">예정된 이벤트 없음</div>`;
        return;
    }

    $("events").innerHTML = list.map(e => `
        <div class="event ${e.d_day <= 7 ? "soon" : ""}">
            <div>
                <div class="e-name">${e.name}</div>
                <div class="e-date">${mmdd(e.date)}</div>
            </div>
            <div class="e-dday">${ddayLabel(e.d_day)}</div>
        </div>`).join("");
}


/* ---------- MARKET ---------- */

function renderMarket(market) {

    const root = $("market");
    root.innerHTML = "";

    for (const [sector, items] of Object.entries(market || {})) {

        const entries = Object.entries(items);
        if (!entries.length) continue;

        const changes = [];

        const cards = entries.map(([name, s]) => {

            const m = pctChange(s.price, s.prev_month);
            const y = pctChange(s.price, s.prev_year);
            const y2 = pctChange(s.price, s.prev_2year);
            const day = pctChange(s.price, s.prev_day);
            changes.push({ m, y, y2 });

            const turn = fmtTurnover(s.turnover, s.currency);
            const sub = [s.theme, turn].filter(Boolean)
                .map(x => `<span>${x}</span>`).join(`<span class="sep">|</span>`) || "&nbsp;";

            return cardHTML({
                icon: tickerIcon(s.ticker || name, name),
                name,
                price: fmtPrice(s),
                dayText: signed(day, 2, "%"), dayV: day,
                sub,
                cells: [
                    { l: "1M", v: m,  cap: CAP.market.m,  text: signed(m, 1, "%") },
                    { l: "1Y", v: y,  cap: CAP.market.y,  text: signed(y, 1, "%") },
                    { l: "2Y", v: y2, cap: CAP.market.y2, text: signed(y2, 0, "%") },
                ],
            });
        }).join("");

        root.insertAdjacentHTML("beforeend", `
        <div class="block ${spanClass(entries.length)}">
            <div class="block-head">
                <span class="block-name">${sector}</span>
                <span class="block-avg">${avgChips(changes)}</span>
            </div>
            <div class="cards">${cards}</div>
        </div>`);
    }

    if (!root.children.length) {
        root.innerHTML = `<div class="empty">데이터 없음 (Actions를 한 번 실행해 주세요)</div>`;
    }
}


/* ---------- MACRO ---------- */

function renderMacro(macro) {

    const groups = Object.entries(macro || {});

    if (!groups.length) {
        $("macro").innerHTML = `<div class="empty">데이터 없음</div>`;
        return;
    }

    let html = "";

    for (const [group, items] of groups) {

        const entries = Object.entries(items);

        const cards = entries.map(([name, s]) => {

            const isPP = s.kind === "pp";
            const cap = isPP ? CAP.pp : CAP.pct;
            const digits = s.digits != null ? s.digits : 2;
            const fmtVal = v => (s.prefix || "") + num(v, digits) + (s.suffix || "");

            const diff = base => {
                if (s.value == null || base == null) return null;
                return isPP ? s.value - base : pctChange(s.value, base);
            };

            // 칸의 글자 = 그 시점의 실제 값 (chips:"pct" 이면 변동률), 색 = 현재 대비 변동
            const cell = (l, base, capV) => {
                const d = diff(base);
                const text = base == null || d == null ? "-"
                    : (s.chips === "pct" ? signed(d, 2, "%") : fmtVal(base));
                return { l, v: d, cap: capV, text };
            };

            const dayV = diff(s.prev_day);
            const dayText = signed(dayV, 2, isPP ? "%p" : "%");

            return cardHTML({
                cls: "macro",
                icon: glyphIcon(name),
                name,
                tag: s.stale ? `<span class="tag-stale" title="자동 수집 실패 → 직전/기본값">캐시</span>` : "",
                price: s.value == null ? "-" : fmtVal(s.value),
                dayText, dayV,
                sub: `<span>${MACRO_DESC[name] || group}</span>`,
                cells: [cell("1M", s.prev_month, cap.m), cell("1Y", s.prev_year, cap.y), cell("2Y", s.prev_2year, cap.y2)],
            });
        }).join("");

        html += `
        <div class="block s1 macro-block">
            <div class="block-head"><span class="block-name">${group}</span></div>
            <div class="cards">${cards}</div>
        </div>`;
    }

    $("macro").innerHTML = html;
}


/* ---------- EARNINGS ---------- */

function surprise(act, est) {
    if (act == null || est == null || Number(est) === 0) return "";
    const v = (act - est) / Math.abs(est) * 100;
    const cls = v > 0 ? "up" : (v < 0 ? "down" : "");
    const arrow = v > 0 ? "▲" : (v < 0 ? "▼" : "");
    return `<span class="sur ${cls}">${arrow}${Math.abs(v).toFixed(1)}%</span>`;
}

function shortQ(label) {
    // "2Q2025" → "2Q25"
    return (label || "").replace(/^(\d)Q\d\d(\d\d)$/, "$1Q$2");
}

// 한 칸: 분기 라벨 / 값 / 전분기 대비 증감(색) / 예상치 대비 서프라이즈
function trendCell(item, prev, fmt, first) {

    const gcol = first ? " gcol" : "";
    if (!item || item.act == null) return `<td class="tc${gcol}">-</td>`;

    const qoq = prev == null || prev === 0 ? null : pctChange(item.act, prev);
    const t = tint(qoq, CAP.earn);
    const chipHtml = qoq == null ? ""
        : `<div><span class="qoq" style="background:${t.bg};color:${t.fg}">${signed(qoq, 1, "%")}</span></div>`;

    if (item.next) {
        return `<td class="tc${gcol}"><div class="q-next">
            <div class="q-lbl">다음 (예상)</div>
            <div class="q-val">${fmt(item.act)}</div>${chipHtml}</div></td>`;
    }
    const est = item.est == null ? ""
        : `<div class="q-est">예상 ${fmt(item.est)}${surprise(item.act, item.est)}</div>`;
    return `<td class="tc${gcol}">
        <div class="q-lbl">${shortQ(item.label)}</div>
        <div class="q-val">${fmt(item.act)}</div>${chipHtml}${est}</td>`;
}

// key: "eps" | "rev"  → [3분기 전, 2분기 전, 직전, 다음 예상] 4칸
function trendCells(e, key, fmt) {

    const qs = (e.quarters || []).slice(-3).map(q => ({
        label: q.label, act: q[key + "_act"], est: q[key + "_est"],
    }));
    while (qs.length < 3) qs.unshift(null);

    const items = [...qs, { next: true, act: e[key + "_est"] }];

    return items.map((it, i) => {
        const prev = i === 0 ? null : (items[i - 1] ? items[i - 1].act : null);
        return trendCell(it, prev, fmt, i === 0);
    }).join("");
}

function renderEarnings(earnings) {

    const list = (earnings || []).filter(e => e.d_day == null || e.d_day >= 0);

    if (!list.length) {
        $("earnings").innerHTML = `<div class="empty">데이터 없음</div>`;
        return;
    }

    const fmtEps = v => v == null ? "-" : "$" + num(v, 2);

    const rows = list.map(e => {

        const cls = e.d_day == null ? "none" : (e.d_day <= 7 ? "soon" : "");

        return `
        <tr class="${cls}">
            <td>
                <div class="t-sym">${e.symbol}</div>
                <div class="t-co">${e.name || ""}</div>
            </td>
            <td>${mmdd(e.date)}</td>
            <td class="t-dday">${ddayLabel(e.d_day)}</td>
            ${trendCells(e, "eps", fmtEps)}
            ${trendCells(e, "rev", fmtRevenue)}
        </tr>`;
    }).join("");

    const sub = `<th class="sub gcol">3분기 전</th><th class="sub">2분기 전</th><th class="sub">직전 분기</th><th class="sub">다음 예상</th>`;

    $("earnings").innerHTML = `
    <table class="earn">
        <thead>
            <tr>
                <th></th><th></th><th></th>
                <th class="grp gcol" colspan="4">EPS 흐름 · 실제값 / 전분기 대비 / 예상 대비</th>
                <th class="grp gcol" colspan="4">매출 흐름 · 실제값 / 전분기 대비 / 예상 대비</th>
            </tr>
            <tr>
                <th>기업</th><th>날짜</th><th>D-Day</th>
                ${sub}${sub}
            </tr>
        </thead>
        <tbody>${rows}</tbody>
    </table>`;
}


/* ---------- 로드 ---------- */

fetch("data.json?t=" + Date.now())
    .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
    })
    .then(data => {
        $("updated").textContent = "Updated " + (data.updated_at || "-");

        safe(() => renderEvents(data.events));
        safe(() => renderMarket(data.market));
        safe(() => renderMacro(data.macro));
        safe(() => renderEarnings(data.earnings));
    })
    .catch(err => {
        document.body.insertAdjacentHTML(
            "afterbegin",
            `<div class="error">data.json을 불러오지 못했습니다 (${err.message}). Actions 실행 결과를 확인해 주세요.</div>`
        );
    });

</script>
