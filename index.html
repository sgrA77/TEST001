<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Market Dashboard</title>
</head>

<body>
    <h1>MARKET DASHBOARD</h1>

    <h2>SPY</h2>
    <h1 id="price">-</h1>

    <p>전일: <span id="day">-</span></p>
    <p>전주: <span id="week">-</span></p>
    <p>전월: <span id="month">-</span></p>
    <p>전년: <span id="year">-</span></p>

    <script>
        fetch("data.json")
            .then(r => r.json())
            .then(data => {
                const s = data.SPY;
                const price = Number(s.price);

                document.getElementById("price").textContent = price.toFixed(2);

                function change(ref) {
                    return ((price - Number(ref)) / Number(ref) * 100).toFixed(2) + "%";
                }

                document.getElementById("day").textContent = change(s.previous_day);
                document.getElementById("week").textContent = change(s.previous_week);
                document.getElementById("month").textContent = change(s.previous_month);
                document.getElementById("year").textContent = change(s.previous_year);
            });
    </script>
</body>
</html>
