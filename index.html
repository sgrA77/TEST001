<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MARKET DASHBOARD</title>
</head>
<body>

    <h1>MARKET DASHBOARD</h1>

    <h2>SPY</h2>
    <p id="spy">불러오는 중...</p>

    <script>
        fetch("data.json")
            .then(response => response.json())
            .then(data => {
                document.getElementById("spy").textContent =
                    data.SPY;
            })
            .catch(error => {
                document.getElementById("spy").textContent =
                    "불러오기 실패";
            });
    </script>

</body>
</html>
