<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Outlook</title>
<style>
/* Market Dashboard(index.html)와 같은 라이트 테마·변수 사용 */
:root{
  --bg:#f3f5f8; --panel:#fff; --card:#f8f9fb; --line:#e2e6ec; --text:#1a1f29; --sub:#657080; --dim:#9aa3b0;
  --yellow:#f0b90b; --amber:#a86e00;
  --up-t:#cf2525; --down-t:#1d56c9;           /* 상승=빨강, 하락=파랑 (대시보드와 동일) */
  --hi:#c0392b; --mid:#b7791f; --lo:#7b8794;   /* 중요도 */
  --bull:#cf2525; --bear:#1d56c9; --neu:#657080;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar a.back{font-size:12.5px;font-weight:700;color:var(--sub);text-decoration:none;white-space:nowrap}
.topbar .ttl{font-size:15px;font-weight:800}
.topbar .upd{font-size:10px;color:var(--dim);text-align:right;line-height:1.25}
.wrap{max-width:1100px;margin:0 auto;padding:16px 20px 48px}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.cs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:700px){.cs{grid-template-columns:1fr}}
.cs>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.cs .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cs .h b{font-size:14px}.cs .mv2{font-size:12px;font-weight:700}
.cs .sm{font-size:12.5px;color:var(--sub);margin:4px 0}
.cs ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--sub)}
.cs .lb{font-size:10.5px;font-weight:800;color:var(--dim);margin-top:6px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--text);border-color:var(--text);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:14px;min-width:0}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-size:11px;font-weight:500;color:var(--dim)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.HIGH{color:var(--hi)}.MEDIUM{color:var(--mid)}.LOW{color:var(--lo)}
.v-Bullish{color:var(--bull)}.v-Bearish{color:var(--bear)}.v-Neutral{color:var(--neu)}
.sup a{font-size:10px;color:var(--amber);text-decoration:none;margin-left:2px;font-weight:700}
.sup a:hover{text-decoration:underline}
/* Market View */
.mv{border-left:4px solid var(--yellow)}
.mv-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mv-label{font-size:20px;font-weight:800}
.mv p{margin:0 0 6px}
.mv .ai{color:var(--sub);font-size:13px}
.note{font-size:11.5px;color:var(--dim)}
/* 번호 리스트 */
.kc{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kc li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.kc .n{font-weight:800;color:var(--amber)}
.kc .t{font-weight:700}
.kc .d{color:var(--sub);font-size:13px;margin-top:2px}
.kc .t .badge{margin-left:6px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
/* AI chain */
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media(max-width:900px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 9px;position:relative;min-width:0}
.step .s{font-size:11px;font-weight:800;color:var(--sub)}
.step .st{font-size:13px;font-weight:800;margin:1px 0 3px}
.step .dd{font-size:12px;color:var(--sub)}
.up{color:var(--up-t)}.flat{color:var(--text)}.warn{color:var(--mid)}
.co{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media(max-width:700px){.co{grid-template-columns:1fr}}
.co>div{font-size:12.5px;color:var(--sub);padding:6px 9px;border:1px solid var(--line);border-radius:8px}
.co b{color:var(--text)}
.gpu{margin-top:10px;font-size:12.5px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--sub)}
/* 표 */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--dim);font-weight:700;white-space:nowrap}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:900px){.mac{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.mac{grid-template-columns:1fr}}
.mac>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.mac .k{font-size:11px;font-weight:800;color:var(--sub)}
.mac .v{font-size:15px;font-weight:800;margin:1px 0}
.mac .x{font-size:12px;color:var(--sub)}
/* 기관 카드 */
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:700px){.inst{grid-template-columns:1fr}}
.ic{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.ih{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.iv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:3px 0}
.in{font-size:12.5px;color:var(--sub)}
/* 시나리오 */
.sc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:820px){.sc{grid-template-columns:1fr}}
.sc>div{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card)}
.sc h3{margin:0 0 4px;font-size:13px}
.sc.lean .on{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
.sc ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--sub)}
.sc p{margin:0;font-size:13px}
/* 변화 */
.vc{display:grid;gap:6px}
.vc>div{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr);gap:8px;padding:7px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.vc .it{font-weight:800;font-size:12.5px}
.vc .ar{font-weight:700}
.vc .rs{font-size:12px;color:var(--sub);margin-top:1px}
.item{padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .d{font-size:12.5px;color:var(--sub);margin-top:2px}
/* 출처 */
.src ol{margin:0;padding-left:22px;font-size:12.5px}
.src li{padding:2px 0}
.src .meta{color:var(--dim);font-size:11px}
.hist{display:grid;gap:6px}
.hist a{display:grid;grid-template-columns:86px 76px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;cursor:pointer}
.hist a.on{border-color:var(--yellow)}
.hist .h{font-size:12.5px}
.empty{padding:18px;color:var(--dim);text-align:center;font-size:13px}
@media(max-width:560px){
  .wrap{padding:10px 10px 40px}
  .topbar{padding:7px 12px}
  .panel{padding:11px 11px 13px}
  .hist a{grid-template-columns:78px 62px minmax(0,1fr)}
  .vc>div{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Dashboard</a>
  <div class="ttl">Market Outlook</div>
  <div class="upd" id="upd">–</div>
</div>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-t="daily" class="on">Daily</button>
    <button data-t="weekly">Weekly</button>
    <button data-t="hist">기록</button>
  </div>
  <div id="view"></div>
</div>

<script>
/* 데이터 파일: outlook.json(최신 Daily) / outlook/index.json(날짜 목록) / outlook/YYYY-MM-DD.json / outlook/weekly.json */
var SRC = {};           // id -> source
var CUR = null;         // 현재 표시중인 daily
var INDEX = [];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sup(ids){
  if(!ids||!ids.length) return '';
  return '<span class="sup">'+ids.map(function(id){var s=SRC[id];return s?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener" title="'+esc(s.publisher+' · '+s.title)+'">['+esc(id.replace(/^s/,''))+']</a>':''}).join('')+'</span>';
}
function imp(v){return v?'<span class="badge '+esc(v)+'">'+esc(v)+'</span>':''}
function stance(v){
  if(!v) return '<span class="note">–</span>';
  var k=String(v).replace('*','');
  return '<b class="v-'+esc(k)+'">'+esc(v)+'</b>';
}
function fetchJson(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json()})}

/* ---------- Daily ---------- */
function renderDaily(D){
  SRC={}; (D.sources||[]).forEach(function(s){SRC[s.id]=s});
  CUR=D;
  document.getElementById('upd').innerHTML=esc(D.date)+'<br>'+esc(D.data_as_of||'');
  var h='';
  var mv=D.market_view||{};
  h+='<section class="panel mv"><h2>Market View <small>Overall View</small></h2>'
    +'<div class="mv-head"><span class="mv-label v-'+esc(mv.label||'Neutral')+'">'+esc(mv.label||'Neutral')+'</span>'+(D.note?'<span class="note">'+esc(D.note)+'</span>':'')+'</div>'
    +'<p>'+esc(mv.summary)+sup(mv.src)+'</p>'
    +(mv.ai_line?'<p class="ai">'+esc(mv.ai_line)+'</p>':'')+'</section>';

  h+='<section class="panel"><h2>Today’s Key Changes <small>가장 중요한 변화</small></h2><ol class="kc">'
    +(D.key_changes||[]).map(function(k,i){return '<li><span class="n">'+(i+1)+'</span><div><div class="t">'+esc(k.title)+imp(k.importance)+sup(k.src)+'</div><div class="d">'+esc(k.detail)+'</div></div></li>'}).join('')+'</ol></section>';

  if((D.view_changed||[]).length){
    h+='<section class="panel"><h2>View Changed <small>기존 대비 달라진 점</small></h2><div class="vc">'
      +D.view_changed.map(function(v){return '<div><span class="it">'+esc(v.item)+'</span><span><span class="ar">'+esc(v.frm)+' → '+esc(v.to)+'</span>'+sup(v.src)+'<div class="rs">'+esc(v.reason)+'</div></span></div>'}).join('')+'</div></section>';
  }

  h+='<section class="panel"><h2>Major Market Issues <small>현재 가장 중요한 이슈</small></h2>'
    +(D.issues||[]).map(function(x){return '<div class="item"><div class="t">'+esc(x.title)+imp(x.importance)+(x.trend==='up'?' <span class="badge up">↑ 부각</span>':x.trend==='down'?' <span class="badge" style="color:var(--lo)">↓ 약화</span>':'')+sup(x.src)+'</div><div class="d">'+esc(x.summary)+'</div></div>'}).join('')+'</section>';

  var A=D.ai_semi||{};
  h+='<section class="panel"><h2>AI / Semiconductor <small>수요 → 공급 → 가격 → 이익</small></h2>'
    +'<p style="margin:0 0 8px">'+esc(A.summary)+(A.direction?' <span class="badge up">'+esc(A.direction)+'</span>':'')+'</p>'
    +'<div class="chain">'+(A.chain||[]).map(function(c,i){var cl=/병목|둔화|하락|약세/.test(c.status)?'warn':/상향|강세|상승|급증|확장|증가/.test(c.status)?'up':'flat';return '<div class="step"><div class="s">'+(i+1)+'. '+esc(c.step)+'</div><div class="st '+cl+'">'+esc(c.status)+'</div><div class="dd">'+esc(c.detail)+sup(c.src)+'</div></div>'}).join('')+'</div>'
    +(A.gpu_rental?'<div class="gpu"><b>GPU 임대가격</b> · '+esc(A.gpu_rental.status)+' — '+esc(A.gpu_rental.note)+'</div>':'')
    +'<div class="co">'+(A.companies||[]).map(function(c){return '<div><b>'+esc(c.name)+'</b> '+esc(c.note)+sup(c.src)+'</div>'}).join('')+'</div></section>';


  function ul(a){return (a&&a.length)?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}
  var CS=D.core_stocks||[];
  if(CS.length) h+='<section class="panel"><h2>AI 핵심 4종목 <small>NVDA · MU · AMD · AVGO</small></h2><div class="cs">'
    +CS.map(function(c){return '<div><div class="h"><b>'+esc(c.ticker)+' <span class="note">'+esc(c.name||'')+'</span></b><span>'+stance(c.stance)+'</span></div>'
      +(c.price||c.move?'<div class="mv2">'+esc([c.price,c.move].filter(Boolean).join(' · '))+'</div>':'')
      +'<div class="sm">'+esc(c.summary)+sup(c.src)+'</div>'
      +(c.catalysts&&c.catalysts.length?'<div class="lb">촉매</div>'+ul(c.catalysts):'')
      +(c.risks&&c.risks.length?'<div class="lb">리스크</div>'+ul(c.risks):'')+'</div>'}).join('')+'</div></section>';
  var SX=D.spacex;
  if(SX&&SX.summary) h+='<section class="panel"><h2>SpaceX <small>관심종목 · 별도 전망</small></h2><div class="cs" style="grid-template-columns:1fr"><div>'
    +'<div class="h"><b>'+esc(SX.ticker||'SpaceX')+' <span class="note">'+esc(SX.status||'')+'</span></b>'+(SX.outlook?'<span class="badge">'+esc(SX.outlook)+'</span>':'')+'</div>'
    +(SX.price||SX.valuation?'<div class="mv2">'+esc([SX.price,SX.valuation].filter(Boolean).join(' · '))+'</div>':'')
    +'<div class="sm">'+esc(SX.summary)+sup(SX.src)+'</div>'
    +(SX.catalysts&&SX.catalysts.length?'<div class="lb">촉매</div>'+ul(SX.catalysts):'')
    +(SX.risks&&SX.risks.length?'<div class="lb">리스크</div>'+ul(SX.risks):'')+'</div></div></section>';
  var GA=D.genai||[];
  if(GA.length) h+='<section class="panel"><h2>Generative AI 기업 <small>Anthropic · OpenAI 등 시장 파급력</small></h2><div class="cs">'
    +GA.map(function(g){return '<div><div class="h"><b>'+esc(g.name)+'</b></div><div class="sm"><b>'+esc(g.headline)+'</b>'+sup(g.src)+'</div>'
      +(g.detail?'<div class="sm">'+esc(g.detail)+'</div>':'')
      +(g.funding?'<div class="lb">투자·기업가치·매출</div><div class="sm">'+esc(g.funding)+'</div>':'')
      +(g.market_impact?'<div class="lb">증시 파급</div><div class="sm">'+esc(g.market_impact)+'</div>':'')+'</div>'}).join('')+'</div></section>';

  h+='<section class="panel"><h2>Macro</h2><div class="mac">'
    +(D.macro||[]).map(function(m){return '<div><div class="k">'+esc(m.name)+'</div><div class="v">'+esc(m.value)+'</div><div class="x">'+esc(m.detail)+sup(m.src)+'</div></div>'}).join('')+'</div></section>';

  h+='<section class="panel"><h2>Institution View <small>기관 전망 · 명확한 근거가 있을 때만 표기</small></h2><div class="inst">'
    +(D.institutions||[]).map(function(i){var st=i.stance||{};return '<div class="ic"><div class="ih"><b>'+esc(i.name)+'</b>'+(i.asof?'<span class="note">'+esc(i.asof)+'</span>':'')+'</div>'
      +'<div class="iv"><span>Market '+stance(st.market)+'</span><span>AI '+stance(st.ai)+'</span>'+(i.change?'<span>변화 <b>'+esc(i.change)+'</b>'+(i.prev?' <span class="note">(이전 '+esc(i.prev)+')</span>':'')+'</span>':'')+'</div>'
      +'<div class="in">'+esc(i.note)+sup(i.src)+'</div></div>'}).join('')+'</div>'
    +'<div class="note" style="margin-top:6px">* 목표가 등에서 해석한 값. “–”는 근거 자료가 없어 View를 부여하지 않음. 변화(↑→↓)는 이전 회차가 쌓이면 자동 계산됩니다.</div></section>';

  h+='<div class="cols"><section class="panel"><h2>Emerging Issues <small>새로 부각</small></h2>'
    +(D.emerging||[]).map(function(e){return '<div class="item"><div class="t">'+esc(e.title)+imp(e.importance)+sup(e.src)+'</div><div class="d">'+esc(e.detail)+'</div></div>'}).join('')+'</section>'
    +'<section class="panel"><h2>Key Risks <small>주요 위험요인</small></h2>'
    +(D.risks||[]).map(function(e){return '<div class="item"><div class="t">'+esc(e.title)+imp(e.importance)+sup(e.src)+'</div><div class="d">'+esc(e.detail)+'</div></div>'}).join('')+'</section></div>';

  var S=D.scenarios||{};
  function sc(k,name){var x=S[k]||{};return '<div class="'+(S.lean&&S.lean.toLowerCase()===k?'on':'')+'"><h3>'+name+(S.lean&&S.lean.toLowerCase()===k?' <span class="badge" style="color:var(--amber)">현재 가장 가까움</span>':'')+'</h3><p>'+esc(x.summary)+'</p><ul>'+(x.conditions||[]).map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div>'}
  h+='<section class="panel"><h2>Bull / Base / Bear <small>발생 조건</small></h2><div class="sc lean">'+sc('bull','Bull Case')+sc('base','Base Case')+sc('bear','Bear Case')+'</div></section>';

  h+='<section class="panel src"><h2>Sources <small>원문 링크 · 같은 사건은 하나로 통합</small></h2><ol>'
    +(D.sources||[]).map(function(s){return '<li value="'+esc(s.id.replace(/^s/,''))+'"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.publisher)+' — '+esc(s.title)+'</a> <span class="meta">'+esc(s.date)+' · '+esc(s.tier)+' · 원문 보기</span></li>'}).join('')+'</ol></section>';
  document.getElementById('view').innerHTML=h;
}

/* ---------- Weekly ---------- */
function renderWeekly(W){
  var v=document.getElementById('view');
  if(!W){v.innerHTML='<div class="panel"><div class="empty">아직 Weekly Outlook이 없습니다.<br>매주 토요일(한국시간) 자동 생성되며, 한 주의 Daily 기록을 비교해 요약합니다.</div></div>';return}
  SRC={}; (W.sources||[]).forEach(function(s){SRC[s.id]=s});
  document.getElementById('upd').innerHTML=esc(W.week||'')+'<br>'+esc(W.period||'');
  function list(a){return (a||[]).map(function(x){return typeof x==='string'?'<div class="item"><div class="d" style="color:var(--text)">'+esc(x)+'</div></div>':'<div class="item"><div class="t">'+esc(x.title||x.item)+imp(x.importance)+sup(x.src)+'</div><div class="d">'+esc(x.detail||x.reason||x.summary||'')+'</div></div>'}).join('')}
  var P=[['① 이번 주 가장 중요한 변화','biggest_changes'],['② 새롭게 부각된 이슈','new_issues'],['③ 중요도가 감소한 이슈','faded_issues'],['④ AI / 반도체 업황 변화','ai_semi'],['④-1 NVDA·MU·AMD·AVGO','core_stocks'],['④-2 SpaceX','spacex'],['④-3 생성형 AI 기업','genai'],['⑤ 주요 기관 전망 변화','institution_changes'],['⑥ Macro 변화','macro'],['⑦ 다음 주 핵심 이벤트','next_week'],['⑧ Bull / Base / Bear 변화','scenario_change']];
  v.innerHTML='<section class="panel mv"><h2>Weekly Market Outlook</h2><p>'+esc(W.summary||'')+'</p></section>'
    +P.map(function(p){return '<section class="panel"><h2>'+p[0]+'</h2>'+(Array.isArray(W[p[1]])?list(W[p[1]]):'<div class="d">'+esc(W[p[1]]||'')+'</div>')+'</section>'}).join('');
}

/* ---------- 기록 ---------- */
function renderHist(){
  var v=document.getElementById('view');
  if(!INDEX.length){v.innerHTML='<div class="panel"><div class="empty">저장된 기록이 없습니다.</div></div>';return}
  var h='<section class="panel"><h2>Market View 변화 기록 <small>날짜를 누르면 그날의 Daily를 엽니다</small></h2><div class="hist">'
   +INDEX.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(x){return '<a data-d="'+esc(x.date)+'" class="'+(CUR&&CUR.date===x.date?'on':'')+'"><span class="h">'+esc(x.date)+'</span><b class="h v-'+esc(x.label)+'">'+esc(x.label)+'</b><span class="h">'+esc(x.headline||'')+'</span></a>'}).join('')+'</div>'
   +'<div class="note" style="margin-top:8px">핵심 동인이 어떻게 바뀌었는지 날짜별로 비교할 수 있습니다.</div></section>';
  v.innerHTML=h;
  [].forEach.call(v.querySelectorAll('.hist a'),function(a){a.onclick=function(){
    fetchJson('outlook/'+a.getAttribute('data-d')+'.json').then(function(d){setTab('daily');renderDaily(d)}).catch(function(e){document.getElementById('view').innerHTML='<div class="panel"><div class="empty">불러오지 못했습니다</div></div>'})}});
}

function setTab(t){
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
}
function show(t){
  setTab(t);
  if(t==='daily'){ if(CUR) renderDaily(CUR); }
  else if(t==='weekly'){ fetchJson('outlook/weekly.json').then(renderWeekly).catch(function(){renderWeekly(null)}) }
  else renderHist();
}
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){show(b.getAttribute('data-t'))}});

Promise.all([fetchJson('outlook.json'), fetchJson('outlook/index.json').catch(function(){return []})]).then(function(r){
  INDEX=r[1]; renderDaily(r[0]);
}).catch(function(e){
  document.getElementById('view').innerHTML='<div class="panel"><div class="empty">outlook.json을 불러오지 못했습니다.<br>아직 생성되지 않았거나 경로가 다릅니다.</div></div>';
});
</script>
</body>
</html>
