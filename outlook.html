<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Outlook</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --card:#f8f9fb; --line:#e2e6ec; --text:#1a1f29; --sub:#657080; --dim:#9aa3b0;
  --yellow:#f0b90b; --amber:#a86e00;
  --hi:#c0392b; --mid:#b7791f; --lo:#7b8794;
  --bull:#cf2525; --bear:#1d56c9; --neu:#657080;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
a{color:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.topbar a.back{font-size:12.5px;font-weight:700;color:var(--sub);text-decoration:none;white-space:nowrap}
.topbar .ttl{font-size:15px;font-weight:800}
.topbar .upd{font-size:10px;color:var(--dim);text-align:right;line-height:1.25}
.nav{position:sticky;top:41px;z-index:5;display:flex;gap:6px;padding:8px 20px;background:rgba(243,245,248,.96);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:12.5px;font-weight:700;color:var(--sub);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px}
.nav a:active{background:var(--text);color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:14px 20px 48px}
section.panel{scroll-margin-top:92px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:14px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-size:11.5px;font-weight:500;color:var(--dim)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:0 7px;border-radius:99px;border:1px solid currentColor;line-height:1.55;white-space:nowrap;vertical-align:1px}
.HIGH{color:var(--hi)}.MEDIUM{color:var(--mid)}.LOW{color:var(--lo)}
.new{color:#0a7d5a}.keep{color:var(--lo)}
.v-Bullish{color:var(--bull)}.v-Bearish{color:var(--bear)}.v-Neutral{color:var(--neu)}
.sup a{font-size:10px;color:var(--amber);text-decoration:none;margin-left:2px;font-weight:700}
.sup a:hover{text-decoration:underline}
/* 한 줄 결론 */
.mv{border-left:4px solid var(--yellow)}
.mv-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mv-label{font-size:22px;font-weight:800}
.mv-date{font-size:12px;color:var(--dim)}
.mv p{margin:0 0 6px}
.mv .ai{color:var(--sub);font-size:13px;padding-top:6px;border-top:1px dashed var(--line)}
/* 오늘의 핵심 변화 */
.kc{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kc li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.kc .n{font-weight:800;color:var(--amber)}
.kc .t{font-weight:700}
.kc .d{color:var(--sub);font-size:13px;margin-top:2px}
/* 이슈/위험 2열 */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.cols>.panel{margin-bottom:0}
@media(max-width:820px){.cols{grid-template-columns:1fr;gap:0}.cols>.panel{margin-bottom:14px}}
.it{padding:9px 0;border-bottom:1px solid var(--line)}
.it:first-of-type{padding-top:0}
.it:last-child{border-bottom:0;padding-bottom:0}
.it .t{font-weight:700}
.it .t .tr{font-size:12px;margin-left:4px}
.it .d{font-size:13px;color:var(--sub);margin-top:2px}
.it .w{font-size:12px;margin-top:4px;color:var(--amber);font-weight:700}
.up{color:var(--bull)}.down{color:var(--bear)}
/* 발언 */
.vsum{font-size:13px;margin:0 0 10px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.vsum li{margin:2px 0}
.vsum ul{margin:0;padding-left:16px}
.vt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
.vt th{font-size:11px;color:var(--dim);font-weight:700;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.vt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;word-break:keep-all}
.vt .gh td{background:#eef1f6;font-weight:800;font-size:13px;padding:7px 8px;color:var(--text);cursor:default}
.vt tr.p{cursor:pointer}
.vt tr.p:hover td{background:#fafbfc}
.vt .who b{display:block}
.vt .who span{font-size:11.5px;color:var(--sub)}
.vt .st{text-align:center}
.vt .q .dt{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.vt tr.p td.q:after{content:" ▾";color:var(--dim);font-size:11px}
.vt tr.p.open td.q:after{content:" ▴"}
.vt tr.dt2 td{background:var(--card);font-size:12.5px;color:var(--sub);padding:9px 10px}
.vt tr.dt2 .ln a{color:var(--amber);font-size:11px;margin-right:8px;text-decoration:none;font-weight:700}
.vt tr.dt2 .ln{margin-top:5px}
.vt tr.dt2{display:none}
.vt tr.dt2.on{display:table-row}
.out{opacity:.62}
.st .badge{font-size:11px}
.s-강세{color:var(--bull)}.s-경계{color:var(--bear)}.s-중립,.s-미확인,.s-정책{color:var(--neu)}.s-낙관,.s-확대{color:var(--bull)}.s-신중{color:var(--mid)}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.vbar button{font:inherit;font-size:12px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 11px;cursor:pointer}
.miss{font-size:12px;color:var(--dim);margin-top:8px}
.miss ul{margin:3px 0 0;padding-left:16px}
/* 흐름 기록 */
.strip{display:flex;gap:3px;margin:0 0 12px;flex-wrap:wrap}
.strip i{width:14px;height:14px;border-radius:3px;display:block}
.strip i.Bullish{background:var(--bull)}.strip i.Bearish{background:var(--bear)}.strip i.Neutral{background:#c5ccd6}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
.tl>div:last-child{border-bottom:0}
.tl .dd{color:var(--sub);font-size:12px}
.tl .fl{font-size:12px;color:var(--sub);margin-top:1px}
.tl .chg{font-size:11px;font-weight:800;margin-left:6px}
/* 출처 */
details.src summary{cursor:pointer;font-size:14px;font-weight:800}
details.src ol{margin:8px 0 0;padding-left:22px;font-size:12.5px}
details.src li{padding:2px 0}
.src .meta{color:var(--dim);font-size:11px}
.empty{padding:18px;color:var(--dim);text-align:center;font-size:13px}
.note{font-size:11.5px;color:var(--dim)}
@media(max-width:560px){
  .wrap{padding:10px 10px 40px}
  .topbar{padding:7px 12px}
  .nav{padding:7px 12px}
  .panel{padding:12px 12px 14px}
  .tl>div{grid-template-columns:40px 58px minmax(0,1fr)}
  .vt{font-size:12.5px}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Dashboard</a>
  <div class="ttl">Market Outlook</div>
  <div class="upd" id="upd">–</div>
</div>
<nav class="nav" id="nav">
  <a href="#s-view">요약</a><a href="#s-chg">오늘의 변화</a><a href="#s-iss">이슈·위험</a><a href="#s-voice">주요 인물 발언</a><a href="#s-flow">흐름 기록</a>
</nav>
<div class="wrap" id="view"><div class="panel"><div class="empty">불러오는 중…</div></div></div>

<script>
/* 데이터: outlook.json(오늘) / voices.json(주요 인물 발언) / outlook/index.json(날짜별 흐름) */
function fj(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var SRC={};
function sup(ids){return (ids||[]).map(function(i){var s=SRC[i];return s?'<span class="sup"><a href="'+esc(s.url)+'" target="_blank" rel="noopener" title="'+esc(s.title)+'">['+esc(i)+']</a></span>':''}).join('')}
function lab(l){return '<span class="v-'+esc(l)+'">'+esc(l)+'</span>'}
function badge(c,t){return '<span class="badge '+c+'">'+esc(t||c)+'</span>'}
var TR={up:'<span class="tr up">▲ 커지는 중</span>',down:'<span class="tr down">▼ 약해지는 중</span>',steady:'<span class="tr" style="color:var(--dim)">– 유지</span>'};

function renderTop(D){
  var mv=D.market_view||{};
  var h='<section class="panel mv" id="s-view"><div class="mv-head"><span class="mv-label v-'+esc(mv.label)+'">'+esc(mv.label)+'</span><span class="mv-date">'+esc(D.date)+' · '+esc(D.data_as_of||'')+'</span></div>'
   +'<p>'+esc(mv.summary||'')+sup(mv.src)+'</p>'+(mv.ai_line?'<div class="ai"><b>AI·반도체</b> '+esc(mv.ai_line)+'</div>':'')+'</section>';
  h+='<section class="panel" id="s-chg"><h2>오늘의 핵심 변화 <small>어제와 달라진 것</small></h2><ol class="kc">'+(D.key_changes||[]).map(function(k,i){
    return '<li><span class="n">'+(i+1)+'</span><div><div class="t">'+esc(k.title)+' '+badge(k.importance)+sup(k.src)+'</div><div class="d">'+esc(k.detail)+'</div></div></li>'}).join('')+'</ol></section>';
  h+='<div class="cols" id="s-iss"><section class="panel"><h2>시장 이슈 <small>지금 시장을 움직이는 쟁점</small></h2>'
   +(D.issues||[]).map(function(x){return '<div class="it"><div class="t">'+esc(x.title)+' '+(x.tag==='신규'?badge('new','신규'):'')+' '+badge(x.importance)+(TR[x.trend]||'')+sup(x.src)+'</div><div class="d">'+esc(x.detail)+'</div></div>'}).join('')+'</section>'
   +'<section class="panel"><h2>주요 위험 <small>터지면 타격이 큰 것 · 확인할 신호</small></h2>'
   +(D.risks||[]).map(function(x){return '<div class="it"><div class="t">'+esc(x.title)+' '+badge(x.importance)+sup(x.src)+'</div><div class="d">'+esc(x.detail)+'</div>'+(x.watch?'<div class="w">확인: '+esc(x.watch)+'</div>':'')+'</div>'}).join('')+'</section></div>';
  return h;
}

function renderVoices(V){
  if(!V)return '<section class="panel" id="s-voice"><h2>주요 인물 발언</h2><div class="empty">voices.json을 불러오지 못했습니다</div></section>';
  var VS={};(V.sources||[]).forEach(function(s){VS[s.n]=s});
  var h='<section class="panel" id="s-voice"><h2>주요 인물 발언 <small>시장을 어떻게 보고 있나 · '+esc(V.window||'')+' · 갱신 '+esc(V.updated||'')+'</small></h2>';
  if(V.summary&&V.summary.length)h+='<div class="vsum"><ul>'+V.summary.map(function(s){return '<li>'+esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</li>'}).join('')+'</ul></div>';
  h+='<div class="vbar"><span class="note">행을 누르면 상세 · 흐리게 표시 = 기간 밖 참고</span><button id="vall">전체 펼치기</button></div>';
  h+='<table class="vt"><colgroup><col style="width:27%"><col style="width:14%"><col></colgroup><thead><tr><th>누가</th><th style="text-align:center">입장</th><th>핵심 워딩</th></tr></thead><tbody>';
  (V.groups||[]).forEach(function(g){
    h+='<tr class="gh"><td colspan="3">'+esc(g.name)+'</td></tr>';
    g.rows.forEach(function(r){
      var links=(r.src||[]).map(function(n){var s=VS[n];return s?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>':''}).join('');
      h+='<tr class="p'+(r.outside?' out':'')+'"><td class="who"><b>'+esc(r.who)+'</b><span>'+esc(r.org)+'</span></td><td class="st">'+badge('s-'+r.stance,r.stance)+'</td><td class="q">'+esc(r.quote)+'<span class="dt">'+esc(r.date)+'</span></td></tr>'
       +'<tr class="dt2"><td colspan="3">'+esc(r.detail).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'<div class="ln">'+links+'</div></td></tr>';
    });
  });
  h+='</tbody></table>';
  if(V.missing&&V.missing.length)h+='<div class="miss">확인 못한 것<ul>'+V.missing.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  h+='<div class="note" style="margin-top:6px">입장 라벨은 발언을 요약해 붙인 것이며 투자 의견이 아닙니다.</div></section>';
  return h;
}

function renderFlow(I){
  if(!I||!I.length)return '<section class="panel" id="s-flow"><h2>흐름 기록</h2><div class="empty">기록 없음</div></section>';
  var a=I.slice().sort(function(x,y){return x.date<y.date?-1:1});
  var h='<section class="panel" id="s-flow"><h2>흐름 기록 <small>날짜별 View와 그 이유 · 최근 '+a.length+'일</small></h2><div class="strip">'
   +a.map(function(x){return '<i class="'+esc(x.label)+'" title="'+esc(x.date)+' '+esc(x.label)+'"></i>'}).join('')+'</div><div class="tl">';
  var rows=a.map(function(x,i){var p=a[i-1];var chg=p&&p.label!==x.label?'<span class="chg v-'+esc(x.label)+'">'+esc(p.label)+'→'+esc(x.label)+'</span>':'';
    return '<div><span class="dd">'+esc(x.date.slice(5).replace('-','/'))+'</span><span>'+lab(x.label)+'</span><span>'+esc(x.headline)+chg+(x.flow?'<div class="fl">'+esc(x.flow)+'</div>':'')+'</span></div>'});
  h+=rows.reverse().join('')+'</div><div class="note" style="margin-top:8px">색 막대: 빨강 Bullish · 회색 Neutral · 파랑 Bearish (왼쪽이 오래된 날)</div></section>';
  return h;
}

function renderSrc(D){
  return '<section class="panel"><details class="src"><summary>출처 '+(D.sources||[]).length+'건 <span class="note">(펼치기)</span></summary><ol>'
   +(D.sources||[]).map(function(s){return '<li id="src-'+esc(s.id)+'">['+esc(s.id)+'] <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a> <span class="meta">'+esc(s.publisher||'')+(s.date?' · '+esc(s.date):'')+'</span></li>'}).join('')
   +'</ol></details></section><div class="note">투자 권유가 아닌 참고용 정리입니다. 근거가 확인되지 않은 내용은 싣지 않습니다.</div>';
}

Promise.all([fj('outlook.json'),fj('voices.json').catch(function(){return null}),fj('outlook/index.json').catch(function(){return []})]).then(function(r){
  var D=r[0],V=r[1],I=r[2];
  (D.sources||[]).forEach(function(s){SRC[s.id]=s});
  document.getElementById('upd').innerHTML='기준 '+esc(D.date)+'<br>'+esc((D.generated_at||'').slice(11,16))+' 생성';
  document.getElementById('view').innerHTML=renderTop(D)+renderVoices(V)+renderFlow(I)+renderSrc(D);
  var rows=document.querySelectorAll('.vt tr.p');
  Array.prototype.forEach.call(rows,function(tr){tr.addEventListener('click',function(){tr.classList.toggle('open');tr.nextElementSibling.classList.toggle('on')})});
  var b=document.getElementById('vall');
  if(b)b.addEventListener('click',function(){var open=b.getAttribute('data-o')!=='1';Array.prototype.forEach.call(rows,function(tr){tr.classList.toggle('open',open);tr.nextElementSibling.classList.toggle('on',open)});b.setAttribute('data-o',open?'1':'0');b.textContent=open?'전체 접기':'전체 펼치기'});
}).catch(function(e){
  document.getElementById('view').innerHTML='<div class="panel"><div class="empty">outlook.json을 불러오지 못했습니다.<br>'+esc(e.message)+'</div></div>';
});
</script>
</body>
</html>
